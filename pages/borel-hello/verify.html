<!doctype html><html lang="ko"><meta charset="utf-8"><title>Borel native-font parity tests</title>
<style>body{font:15px system-ui;margin:40px;line-height:1.7;background:#f3e8de;color:#6f4031}pre{white-space:pre-wrap}button{font:inherit;padding:8px 16px}</style>
<h1>Borel 렌더링 비교 테스트</h1>
<p>영문·숫자·기호, 676개 소문자 조합, name won과 hello의 모든 프레임을 검사합니다.<br>완성 프레임은 브라우저의 실제 폰트 렌더링과 모든 RGBA 바이트가 같아야 통과합니다.</p>
<button id="run" disabled>검사 실행</button><pre id="result">폰트를 불러오는 중…</pre>
<script type="module">
import {loadBorel} from './shaper.ts';
import {runFontParity} from './font-parity.browser.ts';
const button=document.querySelector('#run'), result=document.querySelector('#result');
const {shaper,catalog}=await loadBorel(); button.disabled=false;result.textContent='준비됨';
button.addEventListener('click',async()=>{button.disabled=true;result.textContent='검사 중…';try {const summary=await runFontParity(shaper,catalog,message=>result.textContent=message);result.textContent='PASS\n'+JSON.stringify(summary,null,2);}catch(error){result.textContent='FAIL\n'+error.stack;}finally{button.disabled=false;}});
</script></html>
