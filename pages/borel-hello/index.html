<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3e8de">
  <meta name="description" content="Borel의 연결형 레터링을 한 획씩 쓰는 인터랙티브 애니메이션.">
  <title>Borel Handwriting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a href="/">Jiiwon Studio</a><span>Borel Handwriting <small>01 — handwriting study</small></span></header>
  <form id="text-form" class="text-editor">
    <label for="text-input">쓰고 싶은 문장</label>
    <textarea id="text-input" maxlength="160" rows="2" spellcheck="false" aria-describedby="text-hint text-status">hello</textarea>
    <div class="editor-actions">
      <label class="examples">예시
        <select id="example" aria-label="예시" disabled>
          <option>hello</option>
          <optgroup label="테스트 문장">
            <option>my name is jiwon</option>
            <option>hello my lovely world</option>
            <option>many merry moments</option>
            <option>we move with the wind</option>
            <option>little letters flow</option>
            <option>happy people play</option>
            <option>bring your dreams to life</option>
            <option>every day is a new beginning</option>
            <option>the quick brown fox jumps over the lazy dog</option>
            <option>sphinx of black quartz judge my vow</option>
            <option>Hello, world!</option>
            <option>See you at 7:30!</option>
          </optgroup>
          <optgroup label="문자 모음">
            <option value="abcdefghijklmnopqrstuvwxyz">영문 소문자</option>
            <option value="ABCDEFGHIJKLMNOPQRSTUVWXYZ">영문 대문자</option>
            <option value="0123456789">숫자</option>
            <option value="0123456789 !? &amp; @ # $ % + =">숫자와 기호</option>
          </optgroup>
        </select>
      </label>
      <button id="write" type="submit" disabled>문장 쓰기 ↗</button>
    </div>
    <p id="text-hint">영문 A–Z, a–z · 숫자와 기호 · 최대 160자 · 줄바꿈 가능</p>
    <p id="text-status" role="status" aria-live="polite">필기 자료를 불러오는 중…</p>
    <details class="character-picker"><summary>지원 문자 보기</summary><div id="character-list" aria-label="지원 문자 삽입"></div></details>
  </form>
  <section class="order-inspector" aria-label="경로 살펴보기">
    <div class="color-switch" role="group" aria-label="글씨 색상"><span>색상</span><button id="solid-color" aria-pressed="true"><span class="color-swatch solid-swatch" aria-hidden="true"></span>단색</button><button id="gradient-color" aria-pressed="false"><span class="color-swatch gradient-swatch" aria-hidden="true"></span>그라데이션</button></div>
    <div class="weight-control"><label for="weight">굵기</label><input id="weight" type="range" min="50" max="150" step="5" value="100" aria-valuetext="100%"><output id="weight-value" for="weight">100%</output><button id="reset-weight" aria-label="굵기 기본값으로">기본</button></div>
    <div class="view-switch" role="group" aria-label="보기 모드"><button id="ink-view" aria-pressed="true">잉크</button><button id="tube-view" aria-pressed="false">3D 원통</button><button id="order-view" aria-pressed="false">획순 경로</button></div>
    <div id="tube-controls" hidden>
      <div class="tube-finish-switch" role="group" aria-label="원통 재질"><button id="tube-solid" aria-pressed="true">단색</button><button id="tube-rainbow" aria-pressed="false"><span class="color-swatch rainbow-swatch" aria-hidden="true"></span>무광 무지개</button></div>
      <label id="tube-color-control">원통 색상 <input id="tube-color" type="color" value="#e4dfd8"></label><button id="reset-camera">시점 초기화</button><span>드래그로 회전 · 스크롤로 확대</span>
    </div>
    <p id="tube-status" class="order-note" role="status" hidden></p>
    <div id="order-panel" hidden>
      <div class="order-controls">
        <label>글자 <select id="inspect-letter" aria-label="살펴볼 글자" disabled><option value="">현재 문장</option></select></label>
        <label class="context-control">연결 형태 <select id="inspect-context" aria-label="연결 형태" disabled><option>글자를 선택하세요</option></select></label>
        <a id="inspect-source" href="https://eduscol.education.fr/document/15805/download" target="_blank" rel="noopener noreferrer">프랑스 교본 보기 ↗</a>
      </div>
      <p id="teaching-guide" class="order-note" hidden></p>
      <p class="order-legend"><span class="order-spectrum"></span> 처음 → 끝 · 화살표는 진행 방향 · 점선은 펜을 뗀 이동</p>
      <div class="order-controls step-controls"><button id="previous-step" aria-label="이전 경로 구간">‹</button><label>구간 <select id="inspect-step" aria-label="경로 구간"></select></label><button id="next-step" aria-label="다음 경로 구간">›</button><span id="order-status" role="status"></span></div>
      <p class="order-note">번호는 긴 곡선을 나눈 관찰 구간입니다. 실제 획 개수와 다르며, 점선은 이동 방향만 표시합니다.</p>
    </div>
  </section>
  <main>
    <svg id="artwork" viewBox="0 0 1100 530" role="img" aria-label="Borel 필기체로 한 획씩 써지는 hello"></svg>
    <canvas id="tube-artwork" role="img" aria-label="획순을 따라 그려지는 3D 원통 글씨" hidden></canvas>
  </main>
  <footer>
    <div class="playback"><button id="replay" aria-label="처음부터 다시 쓰기">다시 쓰기 ↻</button><button id="pause">일시정지</button></div>
    <label class="timeline"><span>필기 진행</span><input id="progress" aria-label="필기 진행" type="range" min="0" max="360" step="1" value="0"></label>
    <label class="speed">속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
  </footer>
  <div class="frame-controls"><button id="previous-frame" aria-label="이전 프레임">‹</button><label>프레임 <input id="frame-number" aria-label="프레임 번호" type="number" min="0" max="360" step="1" value="0"></label><span id="frame-count">/ 360</span><button id="next-frame" aria-label="다음 프레임">›</button></div>
  <p class="credit">Borel by <a href="https://github.com/RosaWagner/Borel">Rosalie Wagner</a> · <a href="./assets/OFL.txt">OFL 1.1</a></p>
  <script type="module" src="script.ts"></script>
</body>
</html>
