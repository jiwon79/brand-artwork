<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3e8de">
  <meta name="description" content="Borel의 연결형 레터링을 한 획씩 쓰는 인터랙티브 애니메이션.">
  <title>Borel Handwriting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a href="/">Jiiwon Studio</a><span>Borel Handwriting</span></header>
  <main><svg id="artwork" viewBox="0 0 1100 530" role="img" aria-label="Borel 필기체 애니메이션"></svg></main>
  <form id="text-form" class="controls">
    <textarea id="text-input" maxlength="160" rows="2" spellcheck="false" aria-label="쓰고 싶은 문장" aria-describedby="text-status" placeholder="영문으로 문장을 입력하세요" disabled>hello</textarea>
    <div class="actions">
      <div class="colors" role="group" aria-label="글씨 색상">
        <input id="ink-color" type="color" value="#6f4031" aria-label="단색 선택">
        <button id="gradient-color" type="button" aria-pressed="false">무지개</button>
      </div>
      <button id="pause" type="button" disabled>재생</button>
    </div>
    <p id="text-status" role="status" aria-live="polite" hidden></p>
  </form>
  <a class="credit" href="https://fonts.google.com/specimen/Borel">Borel · Rosalie Wagner</a>
  <script type="module" src="script.ts"></script>
</body>
</html>
