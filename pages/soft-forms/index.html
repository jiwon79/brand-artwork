  <body>
    <canvas id="artwork" aria-label="떠 있는 솜털 캐릭터. 탭하면 반응하고, 길게 누르면 눌리며, 드래그하면 회전합니다."></canvas>
    <div id="variant-picker" role="group" aria-label="형태와 색감 선택">
      <button type="button" data-variant="original" aria-pressed="false" style="--swatch:#ffb8a3"><span class="swatch"></span>노을 솜</button>
      <button type="button" data-variant="bean" aria-pressed="false" style="--swatch:#b4e6bb"><span class="swatch"></span>민트 콩</button>
      <button type="button" data-variant="flower" aria-pressed="false" style="--swatch:#ffc17d"><span class="swatch"></span>살구 꽃</button>
      <button type="button" data-variant="star" aria-pressed="true" style="--swatch:#9aa9f3"><span class="swatch"></span>라일락 별</button>
      <button type="button" data-variant="wave" aria-pressed="false" style="--swatch:#a1e2e9"><span class="swatch"></span>파도 구름</button>
    </div>
    <script type="module" src="./script.ts"></script>
    <script type="module" src="/common/touch-pointer.ts"></script>
