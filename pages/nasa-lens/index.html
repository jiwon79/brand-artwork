<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lens Distortion — easywon</title>
<style>
  :root {
    --bg: #000;
    --accent: #ff1a1a;
    --ink: #eaeaea;
    --mute: #7a7a7a;
    --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  body { position: fixed; inset: 0; }

#stage {
position: fixed;
inset: 0;
width: 100vw;
height: 100vh;
display: block;
z-index: 1;
}

#cursor {
position: fixed;
top: 0; left: 0;
width: 10px; height: 10px;
border-radius: 50%;
border: 1px solid #fff;
mix-blend-mode: difference;
pointer-events: none;
transform: translate(-50%, -50%);
z-index: 100;
opacity: 0;
}
@media (hover: hover) and (pointer: fine) {
html { cursor: none; }
#cursor { opacity: 1; }
}

.brand {
position: fixed;
top: 16px;
left: 16px;
z-index: 10;
font-size: 9px;
letter-spacing: 0.1em;
text-transform: uppercase;
line-height: 1.7;
mix-blend-mode: difference;
color: var(–ink);
pointer-events: none;
}
.brand .k { opacity: 0.5; }
.brand b { font-weight: 500; color: var(–accent); mix-blend-mode: normal; }

#toggle {
position: fixed;
top: 16px;
right: 16px;
z-index: 25;
width: 40px;
height: 40px;
border-radius: 50%;
background: rgba(10,10,10,0.85);
border: 1px solid var(–line);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
color: var(–ink);
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
user-select: none;
font-family: inherit;
}
#toggle::before { content: ‘⚙’; }
#toggle.open::before { content: ‘×’; font-size: 22px; }

.panel {
position: fixed;
top: 64px;
right: 16px;
width: 260px;
max-width: calc(100vw - 32px);
padding: 18px 16px 16px;
background: rgba(10,10,10,0.9);
border: 1px solid var(–line);
backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
z-index: 20;
font-size: 10px;
letter-spacing: 0.08em;
text-transform: uppercase;
color: var(–ink);
transform: translateY(-10px);
opacity: 0;
pointer-events: none;
transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.panel.open {
transform: translateY(0);
opacity: 1;
pointer-events: auto;
}

.panel h3 {
font-size: 9px;
font-weight: 500;
color: var(–mute);
margin-bottom: 14px;
display: flex;
justify-content: space-between;
align-items: center;
}
.panel h3 .dot {
width: 6px; height: 6px; border-radius: 50%;
background: var(–accent);
box-shadow: 0 0 10px var(–accent);
animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.row { margin-bottom: 14px; }
.row:last-child { margin-bottom: 0; }
.row label {
display: flex;
justify-content: space-between;
font-size: 9px;
color: var(–mute);
margin-bottom: 8px;
}
.row label span { color: var(–ink); font-variant-numeric: tabular-nums; }

input[type=range] {
-webkit-appearance: none;
appearance: none;
width: 100%;
height: 20px;
background: transparent;
outline: none;
}
input[type=range]::-webkit-slider-runnable-track {
height: 2px;
background: rgba(255,255,255,0.12);
}
input[type=range]::-moz-range-track {
height: 2px;
background: rgba(255,255,255,0.12);
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 16px; height: 16px;
margin-top: -7px;
background: var(–accent);
border: 0;
border-radius: 50%;
cursor: pointer;
box-shadow: 0 0 10px var(–accent);
}
input[type=range]::-moz-range-thumb {
width: 16px; height: 16px;
background: var(–accent);
border: 0;
border-radius: 50%;
cursor: pointer;
box-shadow: 0 0 10px var(–accent);
}

.toggle-group {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 4px;
}
.toggle-group button {
padding: 10px 6px;
background: transparent;
border: 1px solid var(–line);
color: var(–mute);
font: inherit;
font-size: 9px;
letter-spacing: 0.1em;
text-transform: uppercase;
cursor: pointer;
transition: all 0.15s ease;
}
.toggle-group button.active {
background: var(–accent);
color: #000;
border-color: var(–accent);
}

.text-input {
width: 100%;
padding: 10px 12px;
background: rgba(255,255,255,0.03);
border: 1px solid var(–line);
color: var(–ink);
font: inherit;
font-size: 11px;
letter-spacing: 0.1em;
text-transform: uppercase;
outline: none;
}
.text-input:focus { border-color: var(–accent); }

.hint {
position: fixed;
bottom: 28px;
left: 50%;
transform: translateX(-50%);
font-size: 9px;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(–mute);
z-index: 5;
mix-blend-mode: difference;
pointer-events: none;
white-space: nowrap;
animation: fadeout 5s 3s forwards;
}
@keyframes fadeout { to { opacity: 0; } }

#error {
position: fixed;
inset: 0;
display: none;
align-items: center;
justify-content: center;
background: #000;
color: var(–accent);
font-size: 11px;
letter-spacing: 0.1em;
text-transform: uppercase;
z-index: 50;
padding: 20px;
text-align: center;
}
#error.show { display: flex; }
</style>

</head>
<body>

<canvas id="stage"></canvas>

<div id="cursor"></div>

<div class="brand">
  <div class="k">easywon / lab</div>
  <div><b>LENS.001</b> — spherical distortion</div>
</div>

<button id="toggle" aria-label="toggle controls"></button>

<div class="panel" id="panel">
  <h3>Controls <span class="dot"></span></h3>

  <div class="row">
    <label>Background <span id="bgLabel">TEXT</span></label>
    <div class="toggle-group">
      <button data-bg="text" class="active">Text</button>
      <button data-bg="shape">Shape</button>
    </div>
  </div>

  <div class="row" id="textRow">
    <label>Content</label>
    <input id="textInput" class="text-input" type="text" value="HOT" maxlength="8">
  </div>

  <div class="row" id="shapeRow" style="display:none">
    <label>Pattern <span id="shapeLabel">GRID</span></label>
    <div class="toggle-group">
      <button data-shape="grid" class="active">Grid</button>
      <button data-shape="circles">Circles</button>
    </div>
  </div>

  <div class="row">
    <label>Radius <span id="rVal">0.22</span></label>
    <input id="radius" type="range" min="0.05" max="0.6" step="0.005" value="0.22">
  </div>

  <div class="row">
    <label>Strength <span id="sVal">0.60</span></label>
    <input id="strength" type="range" min="0" max="1.5" step="0.01" value="0.6">
  </div>

  <div class="row">
    <label>Thickness <span id="tVal">1.00</span></label>
    <input id="thickness" type="range" min="0.5" max="3.0" step="0.01" value="1.0">
  </div>
</div>

<div class="hint">touch and drag</div>
<div id="error">WebGL not available on this device</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// Surface any errors to the UI instead of silently failing
window.addEventListener('error', function(e) {
  var err = document.getElementById('error');
  if (err) {
    err.textContent = 'Error: ' + (e.message || 'unknown');
    err.classList.add('show');
  }
});

(function(){
  'use strict';

  var state = {
    bg: 'text',
    text: 'HOT',
    shape: 'grid',
    radius: 0.22,
    strength: 0.6,
    thickness: 1.0,
    mouse: { x: 0.5, y: 0.5 },
    mouseTarget: { x: 0.5, y: 0.5 },
    interacting: false,
    isTouch: false,
  };

  // Offscreen background canvas
  var bgCanvas = document.createElement('canvas');
  var bgCtx = bgCanvas.getContext('2d');

  function drawBackground() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    bgCanvas.width = w * dpr;
    bgCanvas.height = h * dpr;
    bgCtx.setTransform(1, 0, 0, 1, 0, 0);
    bgCtx.scale(dpr, dpr);

    bgCtx.fillStyle = '#000';
    bgCtx.fillRect(0, 0, w, h);

    if (state.bg === 'text') drawText(w, h);
    else drawShape(w, h);

    if (bgTexture) bgTexture.needsUpdate = true;
  }

  function drawText(w, h) {
    var txt = state.text || 'HOT';
    var aspect = h / w;
    var cols = aspect > 1.5 ? 2 : 3;
    var fontSize = w / cols * 0.95;
    var rowSpacing = fontSize * 0.88;
    var rows = Math.ceil(h / rowSpacing) + 2;

    bgCtx.font = '900 ' + fontSize + 'px "Arial Black", "Helvetica Neue", sans-serif';
    bgCtx.textAlign = 'center';
    bgCtx.textBaseline = 'middle';

    var totalH = rowSpacing * rows;
    var startY = (h - totalH) / 2 + rowSpacing / 2;
    var offsets = [0, w * 0.14, -w * 0.1, w * 0.18, -w * 0.06, w * 0.1, -w * 0.14];

    for (var i = 0; i < rows; i++) {
      var y = startY + i * rowSpacing;
      var x = w / 2 + (offsets[i % offsets.length] || 0);

      bgCtx.strokeStyle = 'rgba(255, 20, 20, 0.55)';
      bgCtx.lineWidth = Math.max(2, fontSize * 0.035);
      bgCtx.strokeText(txt, x, y);

      bgCtx.strokeStyle = 'rgba(255, 45, 45, 0.95)';
      bgCtx.lineWidth = Math.max(1, fontSize * 0.012);
      bgCtx.strokeText(txt, x, y);
    }
  }

  function drawShape(w, h) {
    if (state.shape === 'grid') {
      var cols = w < 500 ? 4 : 6;
      var cellW = w / cols;
      var rows = Math.ceil(h / cellW);
      var cellH = h / rows;
      var pad = Math.min(cellW, cellH) * 0.15;

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var x = c * cellW + pad;
          var y = r * cellH + pad;
          var ww = cellW - pad * 2;
          var hh = cellH - pad * 2;

          bgCtx.strokeStyle = 'rgba(255, 20, 20, 0.5)';
          bgCtx.lineWidth = 3;
          bgCtx.strokeRect(x, y, ww, hh);
          bgCtx.strokeStyle = 'rgba(255, 55, 55, 0.95)';
          bgCtx.lineWidth = 1;
          bgCtx.strokeRect(x + 5, y + 5, ww - 10, hh - 10);
        }
      }
    } else {
      var cols2 = w < 500 ? 3 : 5;
      var cellW2 = w / cols2;
      var rows2 = Math.ceil(h / cellW2);
      var cellH2 = h / rows2;
      var radius = Math.min(cellW2, cellH2) * 0.4;

      for (var r2 = 0; r2 < rows2; r2++) {
        for (var c2 = 0; c2 < cols2; c2++) {
          var cx = c2 * cellW2 + cellW2 / 2;
          var cy = r2 * cellH2 + cellH2 / 2;

          bgCtx.strokeStyle = 'rgba(255, 20, 20, 0.5)';
          bgCtx.lineWidth = 3;
          bgCtx.beginPath();
          bgCtx.arc(cx, cy, radius, 0, Math.PI * 2);
          bgCtx.stroke();

          bgCtx.strokeStyle = 'rgba(255, 55, 55, 0.95)';
          bgCtx.lineWidth = 1;
          bgCtx.beginPath();
          bgCtx.arc(cx, cy, radius - 7, 0, Math.PI * 2);
          bgCtx.stroke();
        }
      }
    }
  }

  // Three.js setup
  var stage = document.getElementById('stage');
  var errorEl = document.getElementById('error');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: true, alpha: false });
  } catch (e) {
    errorEl.textContent = 'WebGL unavailable: ' + e.message;
    errorEl.classList.add('show');
    return;
  }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  var scene = new THREE.Scene();
  var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  var bgTexture = new THREE.CanvasTexture(bgCanvas);
  bgTexture.minFilter = THREE.LinearFilter;
  bgTexture.magFilter = THREE.LinearFilter;
  bgTexture.wrapS = THREE.ClampToEdgeWrapping;
  bgTexture.wrapT = THREE.ClampToEdgeWrapping;

  var uniforms = {
    uTex: { value: bgTexture },
    uMouse: { value: new THREE.Vector2(0.5, 0.5) },
    uRadius: { value: state.radius },
    uStrength: { value: state.strength },
    uThickness: { value: state.thickness },
    uActive: { value: 0.0 },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  };

  var vertexShader =
    'varying vec2 vUv;\n' +
    'void main() {\n' +
    '  vUv = uv;\n' +
    '  gl_Position = vec4(position, 1.0);\n' +
    '}';

  // SPHERICAL MAGNIFYING LENS (seamless edge blend)
  //
  // Key change from before: the lens boundary is NO LONGER a hard if-cutoff.
  // Instead, magnification is shaped so it smoothly reaches 1.0 at the rim,
  // which means sampleP = p there → perfectly continuous with the background.
  //
  //   t = d / R   :  [0 at center, 1 at rim, >1 outside]
  //   lensMask    :  smooth 1→0 transition that slightly extends past the
  //                  nominal radius so even the edge transition zone blends.
  //   mag         :  (1 + extra) where `extra` goes smoothly to 0 at the rim
  var fragmentShader =
    'precision highp float;\n' +
    'varying vec2 vUv;\n' +
    'uniform sampler2D uTex;\n' +
    'uniform vec2 uMouse;\n' +
    'uniform vec2 uResolution;\n' +
    'uniform float uRadius;\n' +
    'uniform float uStrength;\n' +
    'uniform float uThickness;\n' +
    'uniform float uActive;\n' +

    'void main() {\n' +
    '  vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);\n' +
    '  vec2 p = vUv * aspect;\n' +
    '  vec2 m = uMouse * aspect;\n' +
    '  vec2 delta = p - m;\n' +
    '  float dist = length(delta);\n' +
    '  float R = uRadius * aspect.y;\n' +

    // Normalized distance. We let this go slightly above 1.0 because we want
    // the rim highlight and a short feather zone to live just outside R.
    '  float t = dist / R;\n' +

    // Lens influence — 1 at center, fades to 0 at and beyond the rim.
    // smoothstep's second half (t in [0.85, 1.0]) is the feather band that
    // blends the lens result back into the untouched background.
    '  float lensMask = 1.0 - smoothstep(0.0, 1.0, t);\n' +
    '  lensMask *= uActive;\n' +

    // Spherical height. Clamp t so this stays real and smooth all the way.
    '  float tc = min(t, 1.0);\n' +
    '  float z = sqrt(max(0.0, 1.0 - tc * tc));\n' +

    // Magnification factor. At the rim z→0 and lensMask→0, so mag→1 which
    // means sampleP == p — perfect hand-off to the background pixel.
    '  float extra = uStrength * pow(z, 0.6) * lensMask * 1.8;\n' +
    '  float mag = 1.0 + extra;\n' +

    // Back-project sample toward the center.
    '  vec2 sampleP = m + delta / mag;\n' +
    '  vec2 sampleUv = sampleP / aspect;\n' +
    '  sampleUv = clamp(sampleUv, vec2(0.0), vec2(1.0));\n' +

    '  vec4 col = texture2D(uTex, sampleUv);\n' +

    // Extra dilation for the "filled outlines" look, weighted by lensMask so
    // it also fades at the edge instead of stopping abruptly.
    '  float coreStrength = pow(z, 1.5) * lensMask;\n' +
    '  float dilate = coreStrength * (uThickness - 0.5);\n' +
    '  if (dilate > 0.01) {\n' +
    '    vec2 px = dilate * 4.0 / uResolution;\n' +
    '    vec4 maxC = col;\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2( 1.0,  0.0) * px));\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2(-1.0,  0.0) * px));\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2( 0.0,  1.0) * px));\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2( 0.0, -1.0) * px));\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2( 0.707,  0.707) * px));\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2(-0.707,  0.707) * px));\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2( 0.707, -0.707) * px));\n' +
    '    maxC = max(maxC, texture2D(uTex, sampleUv + vec2(-0.707, -0.707) * px));\n' +
    '    col = mix(col, maxC, clamp(dilate, 0.0, 1.0));\n' +
    '  }\n' +

    // Soft red "hot core" boost — also masked for seamless fade-out
    '  col.r += coreStrength * 0.3 * col.r;\n' +

    // Gentle rim highlight centered exactly at t=1.0, width based on screen px.
    // Because it's a narrow gaussian-ish blip it never creates a hard seam.
    '  float rimT = abs(t - 1.0);\n' +
    '  float rimWidth = 0.06;\n' +
    '  float rim = exp(-rimT * rimT / (rimWidth * rimWidth)) * uActive;\n' +
    '  col.rgb += vec3(0.35, 0.05, 0.05) * rim * 0.5;\n' +

    // Optional inner vignette near the rim (inside only), weighted by mask
    '  float innerShade = smoothstep(0.75, 1.0, tc) * lensMask;\n' +
    '  col.rgb *= mix(1.0, 0.88, innerShade);\n' +

    '  col.rgb = clamp(col.rgb, 0.0, 1.0);\n' +
    '  gl_FragColor = col;\n' +
    '}';

  var mat = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
  });

  var quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  scene.add(quad);

  // Input
  var cursor = document.getElementById('cursor');

  function setPointer(x, y) {
    state.mouseTarget.x = x / window.innerWidth;
    state.mouseTarget.y = 1.0 - y / window.innerHeight;
    if (cursor) {
      cursor.style.transform = 'translate(' + x + 'px, ' + y + 'px) translate(-50%, -50%)';
    }
  }

  // Desktop
  window.addEventListener('mousemove', function(e) {
    if (state.isTouch) return;
    state.interacting = true;
    setPointer(e.clientX, e.clientY);
  });

  // Touch — only active while finger down
  stage.addEventListener('touchstart', function(e) {
    state.isTouch = true;
    state.interacting = true;
    if (e.touches[0]) {
      setPointer(e.touches[0].clientX, e.touches[0].clientY);
      // Snap on first touch so it appears where finger lands
      state.mouse.x = state.mouseTarget.x;
      state.mouse.y = state.mouseTarget.y;
    }
  }, { passive: true });

  stage.addEventListener('touchmove', function(e) {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  stage.addEventListener('touchend', function() {
    state.interacting = false;
  });
  stage.addEventListener('touchcancel', function() {
    state.interacting = false;
  });

  // Resize
  var resizeTimer;
  function handleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
      drawBackground();
    }, 100);
  }
  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', handleResize);

  // UI
  function $(id) { return document.getElementById(id); }

  var toggleBtn = $('toggle');
  var panel = $('panel');
  toggleBtn.addEventListener('click', function() {
    panel.classList.toggle('open');
    toggleBtn.classList.toggle('open');
  });

  if (window.innerWidth > 700) {
    panel.classList.add('open');
    toggleBtn.classList.add('open');
  }

  var bgButtons = document.querySelectorAll('[data-bg]');
  for (var i = 0; i < bgButtons.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        for (var j = 0; j < bgButtons.length; j++) bgButtons[j].classList.remove('active');
        btn.classList.add('active');
        state.bg = btn.getAttribute('data-bg');
        $('bgLabel').textContent = state.bg.toUpperCase();
        $('textRow').style.display = state.bg === 'text' ? '' : 'none';
        $('shapeRow').style.display = state.bg === 'shape' ? '' : 'none';
        drawBackground();
      });
    })(bgButtons[i]);
  }

  var shapeButtons = document.querySelectorAll('[data-shape]');
  for (var k = 0; k < shapeButtons.length; k++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        for (var j = 0; j < shapeButtons.length; j++) shapeButtons[j].classList.remove('active');
        btn.classList.add('active');
        state.shape = btn.getAttribute('data-shape');
        $('shapeLabel').textContent = state.shape.toUpperCase();
        drawBackground();
      });
    })(shapeButtons[k]);
  }

  $('textInput').addEventListener('input', function(e) {
    state.text = e.target.value.toUpperCase() || 'HOT';
    drawBackground();
  });

  function wireSlider(id, key, label) {
    var el = $(id);
    var out = $(label);
    el.addEventListener('input', function() {
      state[key] = parseFloat(el.value);
      out.textContent = state[key].toFixed(2);
    });
  }
  wireSlider('radius', 'radius', 'rVal');
  wireSlider('strength', 'strength', 'sVal');
  wireSlider('thickness', 'thickness', 'tVal');

  // On non-touch, start with lens visible in middle
  if (!('ontouchstart' in window)) {
    state.interacting = true;
  }

  // Loop
  function tick() {
    state.mouse.x += (state.mouseTarget.x - state.mouse.x) * 0.18;
    state.mouse.y += (state.mouseTarget.y - state.mouse.y) * 0.18;

    var activeTarget = state.interacting ? 1.0 : 0.0;
    uniforms.uActive.value += (activeTarget - uniforms.uActive.value) * 0.15;

    uniforms.uMouse.value.x = state.mouse.x;
    uniforms.uMouse.value.y = state.mouse.y;
    uniforms.uRadius.value = state.radius;
    uniforms.uStrength.value = state.strength;
    uniforms.uThickness.value = state.thickness;

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  drawBackground();
  tick();
})();
</script>

</body>
