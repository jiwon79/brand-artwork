<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fbfbfa">
  <title>Color Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="Interactive Color Text artwork">
    <canvas id="artwork"></canvas>
    <p id="error" role="status">WebGL is required to view this artwork.</p>
  </main>

  <nav id="debug-controls" aria-label="Rendering stages">
    <button type="button" data-debug-stage="0">Falloff</button>
    <button type="button" data-debug-stage="1">Contact</button>
    <button type="button" data-debug-stage="2">Solver</button>
    <button type="button" data-debug-stage="3">Contour</button>
    <button type="button" class="active" aria-current="step" data-debug-stage="4">Final</button>
  </nav>
  <script type="module" src="script.ts"></script>
</body>
</html>
