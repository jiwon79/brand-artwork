<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fbfbfa">
  <title>Color Text — Process View</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="debug-page" data-debug="true">
  <main aria-label="Interactive Color Text process view">
    <canvas id="artwork"></canvas>
    <p id="error" role="status">WebGL is required to view this artwork.</p>
  </main>

  <section id="debug-controls" aria-label="Rendering stages">
    <header class="debug-stage-copy" aria-live="polite">
      <span id="debug-stage-index">01</span>
      <span class="debug-stage-text">
        <strong id="debug-stage-title">FALLOFF</strong>
        <span id="debug-stage-description">Touch influence before it meets the text</span>
      </span>
    </header>

    <nav class="debug-stage-buttons" role="tablist" aria-label="Choose a rendering stage">
      <button type="button" class="active" role="tab" aria-selected="true" data-debug-stage="0">
        <span>01</span>Falloff
      </button>
      <button type="button" role="tab" aria-selected="false" data-debug-stage="1" tabindex="-1">
        <span>02</span>Active
      </button>
      <button type="button" role="tab" aria-selected="false" data-debug-stage="2" tabindex="-1">
        <span>03</span>Field
      </button>
      <button type="button" role="tab" aria-selected="false" data-debug-stage="3" tabindex="-1">
        <span>04</span>Surface
      </button>
      <button type="button" role="tab" aria-selected="false" data-debug-stage="4" tabindex="-1">
        <span>05</span>Final
      </button>
    </nav>
  </section>

  <script type="module" src="script.ts"></script>
</body>
</html>
