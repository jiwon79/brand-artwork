<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="드래그한 곳의 꽃과 스마일이 회전하며 바뀌는 파스텔 3D 작품." />
    <title>Flower & Smiley</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23eaa6cc'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="artwork" data-mode="field" aria-busy="true">
      <h1 class="sr-only">Flower & Smiley</h1>
      <div class="stage">
        <canvas id="studio-canvas" role="img" aria-label="드래그한 위치의 꽃과 스마일이 뒤집히는 3D 작품"></canvas>
        <p class="status" role="status">꽃을 피우는 중…</p>
      </div>
      <div class="inspection-controls">
        <span id="field-help">드래그해서 돌리기 · 빠를수록 오래 회전</span>
        <span id="rotation-help" hidden>드래그해서 회전<span class="sr-only">. 방향키로 회전, Home 키로 기본 각도.</span></span>
        <button class="reset-view-button" type="button" hidden disabled>기본 각도</button>
      </div>
      <div class="toolbar" aria-label="애니메이션 설정">
        <a href="/" aria-label="작품 목록으로 돌아가기">↖</a>
        <button class="mode-button" type="button" disabled>하나씩 보기</button>
        <span class="divider" aria-hidden="true"></span>
        <button class="reset-field-button" type="button" disabled aria-label="모두 꽃으로 되돌리기">초기화</button>
        <button class="flip-button" type="button" hidden disabled>꽃으로 바꾸기 <span aria-hidden="true">↻</span></button>
        <button class="look-button" type="button" disabled aria-expanded="false" aria-controls="look-panel">조정</button>
      </div>
      <aside id="look-panel" class="look-panel" aria-label="색감·재질 조정" hidden>
        <div class="look-heading"><strong>색감·재질</strong><button class="look-close" type="button" aria-label="조정 패널 닫기">×</button></div>
        <p class="look-help">무광 정도를 높이면 반사가 넓게 퍼집니다.<br />변경은 현재 화면에만 적용되며 새로고침하면 초기화됩니다.</p>
        <div class="look-gui"></div>
        <p class="look-feedback" role="status" aria-live="polite"></p>
      </aside>
      <p class="sr-only" id="model-status" aria-live="polite"></p>
    </main>
    <noscript>3D 애니메이션을 보려면 JavaScript를 켜주세요.</noscript>
    <script type="module" src="/common/touch-pointer.ts"></script>
    <script type="module" src="./script.ts"></script>
  </body>
</html>
