<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brand-artwork.vercel.app/pages/smile-flower/" />
    <meta property="og:title" content="웃음꽃" />
    <meta property="og:description" content="꽃과 웃는 얼굴이 회전하며 피어나는 파스텔 3D 아트워크." />
    <meta property="og:image" content="https://brand-artwork.vercel.app/pages/smile-flower/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="웃음꽃" />
    <meta name="twitter:description" content="꽃과 웃는 얼굴이 회전하며 피어나는 파스텔 3D 아트워크." />
    <meta name="twitter:image" content="https://brand-artwork.vercel.app/pages/smile-flower/assets/og-image.jpg" />
    <meta name="twitter:image:alt" content="파스텔 꽃 사이에 여러 색의 웃는 얼굴이 피어난 웃음꽃 작품" />
    <title>웃음꽃</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23eaa6cc'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="artwork" aria-busy="true">
      <h1 class="sr-only">웃음꽃</h1>
      <div class="stage">
        <canvas id="studio-canvas" role="img" aria-label="드래그한 위치의 꽃과 스마일이 뒤집히는 3D 작품"></canvas>
        <p class="status" role="status">꽃을 피우는 중…</p>
      </div>
      <aside id="look-panel" class="look-panel" aria-label="색감·재질·회전 조정" hidden>
        <div class="look-heading"><strong>색감·재질·회전</strong><button class="look-close" type="button" aria-label="조정 패널 닫기">×</button></div>
        <p class="look-help">무광 정도를 높이면 반사가 넓게 퍼집니다.<br />변경은 현재 화면에만 적용되며 새로고침하면 초기화됩니다.</p>
        <div class="look-gui"></div>
        <p class="look-feedback" role="status" aria-live="polite"></p>
      </aside>
    </main>
    <noscript>3D 애니메이션을 보려면 JavaScript를 켜주세요.</noscript>
    <script type="module" src="/common/touch-pointer.ts"></script>
    <script type="module" src="./script.ts"></script>
  </body>
</html>
