<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dab8be" />
    <title>Rose Glass — Brand Artwork</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main aria-label="분홍빛 반투명 조약돌 작품">
      <canvas id="artwork" tabindex="0" aria-label="중앙 조약돌을 누르거나 당겨 형태를 바꿔보세요. 커서는 조명을 움직입니다. 방향키로 이동하고 Escape 키로 원래 형태로 돌아갑니다." aria-describedby="instructions"></canvas>
      <p id="instructions" class="sr-only">중앙 분홍 조약돌을 누르면 잡은 곳이 눌리고 주변이 부풉니다. 당기면 그 주변이 늘어나며, 놓으면 탄성 있게 원래 형태로 복원됩니다. 배경에서는 조명만 움직입니다. 방향키로 이동하고 Escape 키로 위치와 형태를 초기화합니다.</p>
      <p id="error" role="alert" hidden>이 작품에는 WebGL 2가 필요합니다. 브라우저의 그래픽 가속을 켜고 새로고침해 주세요.</p>
    </main>
    <script type="module" src="/common/touch-pointer.ts"></script>
    <script type="module" src="./script.ts"></script>
  </body>
</html>
