<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dab8be" />
    <title>Rose Glass — Brand Artwork</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main aria-label="분홍빛 반투명 조약돌 작품">
      <canvas id="artwork" tabindex="0" aria-label="조약돌을 드래그하거나 방향키로 움직이세요. Escape 키로 원래 구도로 돌아갑니다." aria-describedby="instructions"></canvas>
      <span id="cursor-halo" class="rose-cursor rose-cursor--halo" aria-hidden="true"></span>
      <span id="cursor-dot" class="rose-cursor rose-cursor--dot" aria-hidden="true"></span>
      <p id="instructions" class="sr-only">드래그하면 조약돌이 움직이고 놓으면 돌아옵니다. 방향키로도 움직일 수 있습니다. Escape 키로 초기화합니다.</p>
      <p id="error" role="alert" hidden>이 작품에는 WebGL 2가 필요합니다. 브라우저의 그래픽 가속을 켜고 새로고침해 주세요.</p>
    </main>
    <script type="module" src="./script.ts"></script>
  </body>
</html>
