<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dab8be" />
    <title>Rose Glass — Brand Artwork</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main aria-label="분홍빛 반투명 조약돌 작품">
      <canvas id="artwork" tabindex="0" aria-label="최대 다섯 손가락으로 중앙 조약돌을 잡고 늘려보세요. 조명은 자동으로 이동합니다. 방향키로 이동하고 Escape 키로 복원합니다." aria-describedby="instructions"></canvas>
      <p id="instructions" class="sr-only">중앙 분홍 조약돌을 여러 손가락으로 동시에 당길 수 있습니다. 놓은 부분은 탄성 있게 복원되며 다른 손가락의 잡기는 유지됩니다. 조명은 자동으로 이동합니다. 방향키로 이동하고 Escape 키로 초기화합니다.</p>
      <p id="error" role="alert" hidden>이 작품에는 WebGL 2가 필요합니다. 브라우저의 그래픽 가속을 켜고 새로고침해 주세요.</p>
    </main>
    <script type="module" src="/common/touch-pointer.ts"></script>
    <script type="module" src="./script.ts"></script>
  </body>
</html>
