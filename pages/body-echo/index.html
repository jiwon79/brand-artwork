<!DOCTYPE html>
<html lang="ko" data-touch-cursor-release-ripple="false">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Body Echo</title>
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://brand-artwork.vercel.app/pages/body-echo/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brand-artwork.vercel.app/pages/body-echo/">
  <meta property="og:title" content="Body Echo">
  <meta property="og:image" content="https://brand-artwork.vercel.app/pages/body-echo/assets/reference-frame.png">
  <meta property="og:image:alt" content="RGB human afterimages dissolving into particles">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Body Echo">
  <meta name="twitter:image" content="https://brand-artwork.vercel.app/pages/body-echo/assets/reference-frame.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Body Echo interactive artwork">
    <canvas
      id="artwork"
      tabindex="0"
      role="img"
      aria-label="겹쳐진 인체 잔상이 터치와 드래그에 반응하고 두 손가락 사이의 선에 닿은 부분이 RGB 입자로 분해되는 인터랙티브 작품"
    ></canvas>
  </main>
  <div id="loading" role="status" aria-live="polite" data-stage="1">
    <div class="loading-content">
      <div class="loading-preview" aria-hidden="true">
        <svg viewBox="0 0 180 104">
          <g class="preview-figure">
            <path class="preview-line preview-line-red" d="M91 9 C80 10 78 21 88 26 C99 32 84 37 73 32 C63 27 57 38 67 47 C74 53 84 52 89 61 C94 71 85 82 75 94 M67 46 C54 50 45 60 34 65 M86 47 C101 51 111 60 122 64 M79 63 C67 72 59 83 52 96 M90 63 C102 73 109 84 116 96" />
            <path class="preview-line preview-line-green" d="M91 9 C80 10 78 21 88 26 C99 32 84 37 73 32 C63 27 57 38 67 47 C74 53 84 52 89 61 C94 71 85 82 75 94 M67 46 C54 50 45 60 34 65 M86 47 C101 51 111 60 122 64 M79 63 C67 72 59 83 52 96 M90 63 C102 73 109 84 116 96" />
            <path class="preview-line preview-line-blue" d="M91 9 C80 10 78 21 88 26 C99 32 84 37 73 32 C63 27 57 38 67 47 C74 53 84 52 89 61 C94 71 85 82 75 94 M67 46 C54 50 45 60 34 65 M86 47 C101 51 111 60 122 64 M79 63 C67 72 59 83 52 96 M90 63 C102 73 109 84 116 96" />
            <path class="preview-line preview-line-white" d="M91 9 C80 10 78 21 88 26 C99 32 84 37 73 32 C63 27 57 38 67 47 C74 53 84 52 89 61 C94 71 85 82 75 94 M67 46 C54 50 45 60 34 65 M86 47 C101 51 111 60 122 64 M79 63 C67 72 59 83 52 96 M90 63 C102 73 109 84 116 96" />
          </g>
          <g class="preview-wave">
            <circle cx="82" cy="55" r="12" />
            <circle cx="82" cy="55" r="12" />
          </g>
          <g class="preview-particles">
            <circle cx="100" cy="29" r="1.6" style="--dx: 28px; --dy: -8px; --delay: 0ms" />
            <circle cx="105" cy="39" r="1.2" style="--dx: 36px; --dy: 3px; --delay: 90ms" />
            <circle cx="112" cy="51" r="1.8" style="--dx: 30px; --dy: -4px; --delay: 180ms" />
            <circle cx="119" cy="64" r="1.3" style="--dx: 38px; --dy: 8px; --delay: 50ms" />
            <circle cx="109" cy="75" r="1.5" style="--dx: 32px; --dy: 4px; --delay: 140ms" />
            <circle cx="116" cy="89" r="1.1" style="--dx: 40px; --dy: -2px; --delay: 230ms" />
          </g>
        </svg>
      </div>
      <div class="loading-message">
        <span id="loading-label">01 · LINE</span>
        <span id="loading-description">SVG의 선 구조를 준비합니다</span>
      </div>
      <div
        id="loading-progress"
        class="loading-progress"
        role="progressbar"
        aria-label="작품 준비 단계"
        aria-valuemin="1"
        aria-valuemax="4"
        aria-valuenow="1"
      >
        <span class="loading-progress-fill"></span>
      </div>
      <ol class="loading-stages" aria-hidden="true">
        <li class="active" data-loading-stage="1">LINE</li>
        <li data-loading-stage="2">CHROMATIC</li>
        <li data-loading-stage="3">WAVE</li>
        <li data-loading-stage="4">DISSOLVE</li>
      </ol>
    </div>
  </div>
  <div id="error" role="alert"></div>

  <script type="module" src="/common/touch-cursor.ts"></script>
  <script type="module" src="script.ts"></script>
</body>
</html>
