<!DOCTYPE html>
<html lang="ko" data-touch-cursor-release-ripple="false">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Body Echo</title>
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://brand-artwork.vercel.app/pages/body-echo/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brand-artwork.vercel.app/pages/body-echo/">
  <meta property="og:title" content="Body Echo">
  <meta property="og:image" content="https://brand-artwork.vercel.app/pages/body-echo/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Body Echo RGB human afterimages intersected by a neon wave">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Body Echo">
  <meta name="twitter:image" content="https://brand-artwork.vercel.app/pages/body-echo/assets/og-image.jpg">
  <meta name="twitter:image:alt" content="Body Echo RGB human afterimages intersected by a neon wave">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Body Echo interactive artwork">
    <canvas
      id="artwork"
      tabindex="0"
      role="img"
      aria-label="겹쳐진 인체 잔상이 터치와 드래그에 반응하고 두 손가락 사이의 선에 닿은 부분이 RGB 입자로 분해되는 인터랙티브 작품"
    ></canvas>
  </main>
  <div id="loading" role="status" aria-live="polite">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span>SVG 불러오는 중</span>
  </div>
  <div id="error" role="alert"></div>

  <script type="module" src="/common/touch-cursor.ts"></script>
  <script type="module" src="script.ts"></script>
</body>
</html>
