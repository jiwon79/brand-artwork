<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#52749a">
  <meta name="description" content="빛을 바꾸고 구름을 돌아보는 인터랙티브 3D 작품. Jiiwon Studio.">
  <title>Clouds · Jiiwon Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="cloud-canvas" tabindex="0" aria-label="3D 구름. 드래그나 방향키로 회전, 스크롤이나 두 손가락으로 확대. R 키로 시점 초기화."></canvas>
  <header>
    <a class="identity" href="/" aria-label="Jiiwon Studio로 돌아가기"><span class="wordmark">Clouds<span>.</span></span><span class="edition">JIIWON STUDIO<br>AN INTERACTIVE ATMOSPHERE</span></a>
    <div class="toolbar"><button id="toggle" aria-controls="controls" aria-expanded="true" aria-label="설정 닫기">☷</button><button id="save" disabled>프레임 저장 ↗</button></div>
  </header>
  <div class="metrics" aria-label="렌더링 상태"><span id="fps">준비 중</span><span id="gpu">GPU —</span></div>
  <aside id="controls" aria-label="구름 설정">
    <div class="panel-heading"><div><p class="eyebrow">THE ATMOSPHERE</p><h1>Shape & light</h1></div><span aria-hidden="true">☼</span></div>
    <label class="label" for="formation">구름 형태 <output id="seed">SEED 7351</output></label>
    <select id="formation"><option value="cumulus">맑은 날 · Fair weather</option><option value="tower">솟는 구름 · Towering cumulus</option><option value="sunset">저녁빛 · Evening light</option><option value="bank">구름 바다 · Cloud sea</option><option value="storm">폭풍의 밤 · Thunderstorm</option></select>
    <div class="divider"></div>
    <label class="label" for="elevation">태양 높이 <output id="elevation-value">38°</output></label><input id="elevation" type="range" min="3" max="85" value="38"><div class="range-hints"><span>지평선</span><span>머리 위</span></div>
    <label class="label" for="azimuth">태양 방향 <output id="azimuth-value">−65°</output></label><input id="azimuth" type="range" min="-180" max="180" value="-65">
    <label class="label" for="density">구름 밀도 <output id="density-value">1.55</output></label><input id="density" type="range" min="0.3" max="3" step="0.05" value="1.55">
    <label class="label" for="exposure">노출 <output id="exposure-value">0.00 EV</output></label><input id="exposure" type="range" min="-1.5" max="1.5" step="0.05" value="0">
    <div class="actions"><button id="new-cloud">↻ 새 구름</button><button id="orbit" aria-pressed="false">궤도 회전</button></div>
    <div id="storm-controls" hidden><button id="flash">번개</button><button id="lightning" aria-pressed="true">자동 번개 켜짐</button></div>
    <details><summary>화질과 카메라 <span>+</span></summary>
      <label class="label" for="detail">정지 화면 화질</label><select id="detail"><option value="balanced">균형 · 빠른 완성</option><option value="high">고화질 · 정밀한 완성</option></select>
      <label class="label" for="glare">빛 번짐 <output id="glare-value">32%</output></label><input id="glare" type="range" min="0" max="1" step="0.01" value="0.32">
      <p class="note">움직이는 동안 가볍게 그린 뒤, 멈추면 세부 묘사를 복원합니다.</p>
      <dl><div><dt>구름 이미지</dt><dd id="resolution">—</dd></div><div><dt>누적 샘플</dt><dd id="samples">—</dd></div></dl>
    </details>
  </aside>
  <footer><div class="caption"><span id="number">01 / 05</span><div><p id="scene-name">Fair weather</p><span id="scene-description">Cumulus humilis · daylight</span></div></div><div class="navigation"><span>드래그로 회전 · 스크롤로 확대</span><button id="reset">시점 초기화 ↺</button></div><p id="status" role="status">구름을 불러오는 중</p></footer>
  <nav class="mobile-nav" aria-label="시점 조절"><button id="zoom-in" aria-label="확대">+</button><button id="zoom-out" aria-label="축소">−</button></nav>
  <div id="loading" class="loading"><div class="loading-cloud"></div><p>구름을 불러오는 중</p></div>
  <div id="error" role="alert" hidden><h2>구름을 표시할 수 없습니다</h2><p id="error-message"></p><button id="reload">다시 불러오기</button></div>
  <script type="module" src="./script.ts"></script>
</body>
</html>
