<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>Line Pull</title>
  <link rel="canonical" href="https://brand-artwork.vercel.app/pages/line-pull/">
  <meta name="description" content="가로줄을 눌러 당기면 숨겨진 문구가 나타납니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brand-artwork.vercel.app/pages/line-pull/">
  <meta property="og:title" content="Line Pull">
  <meta property="og:description" content="가로줄을 눌러 당기면 숨겨진 문구가 나타납니다.">
  <meta property="og:image" content="https://brand-artwork.vercel.app/pages/line-pull/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="왼쪽 위에 Line Pull 제목이 있고, 거친 검은 표면의 흰 선이 벌어지며 붉은 틈 사이로 안녕하세요가 드러나는 공유 이미지">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Line Pull">
  <meta name="twitter:description" content="가로줄을 눌러 당기면 숨겨진 문구가 나타납니다.">
  <meta name="twitter:image" content="https://brand-artwork.vercel.app/pages/line-pull/assets/og-image.png">
  <meta name="twitter:image:alt" content="왼쪽 위에 Line Pull 제목이 있고, 거친 검은 표면의 흰 선이 벌어지며 붉은 틈 사이로 안녕하세요가 드러나는 공유 이미지">
  <link rel="preload" href="./assets/Pretendard-ExtraBold.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main
    id="stage"
    class="stage"
    aria-label="가로줄을 눌러 당기면 숨겨진 문구가 나타납니다"
  >
    <svg id="artwork" class="artwork" aria-hidden="true">
      <defs id="artwork-defs">
        <clipPath id="reveal-clip" clipPathUnits="userSpaceOnUse">
          <path id="reveal-path"></path>
        </clipPath>
      </defs>

      <g id="root-surface" data-layer-depth="0">
        <g id="reveal" class="reveal" clip-path="url(#reveal-clip)" opacity="0">
          <rect id="reveal-background"></rect>
          <text id="reveal-copy" text-anchor="middle" dominant-baseline="middle"></text>
        </g>

        <path id="origin-pull-path" class="origin-pull-path"></path>
        <g id="line-field" class="line-field"></g>
      </g>
    </svg>

    <div id="surface-grain" class="surface-grain" aria-hidden="true"></div>

  </main>

  <script type="module" src="script.ts"></script>
  <script type="module" src="/common/touch-pointer.ts"></script>
</body>
</html>
