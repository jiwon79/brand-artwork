<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>Line Pull</title>
  <link rel="preload" href="./assets/Pretendard-ExtraBold.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main
    id="stage"
    class="stage"
    aria-label="가로줄을 눌러 당기면 숨겨진 문구가 나타납니다"
  >
    <svg id="artwork" class="artwork" aria-hidden="true">
      <defs id="artwork-defs">
        <clipPath id="reveal-clip" clipPathUnits="userSpaceOnUse">
          <path id="reveal-path"></path>
        </clipPath>
      </defs>

      <g id="root-surface" data-layer-depth="0">
        <g id="reveal" class="reveal" clip-path="url(#reveal-clip)" opacity="0">
          <rect id="reveal-background"></rect>
          <text id="reveal-copy" text-anchor="middle" dominant-baseline="middle"></text>
        </g>

        <path id="origin-pull-path" class="origin-pull-path"></path>
        <g id="line-field" class="line-field"></g>
      </g>
    </svg>

    <div id="surface-grain" class="surface-grain" aria-hidden="true"></div>

  </main>

  <script type="module" src="script.ts"></script>
  <script type="module" src="/common/touch-pointer.ts"></script>
</body>
</html>
