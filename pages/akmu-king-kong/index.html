<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AKMU - King Kong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <div id="content">
      <div id="video-section">
        <div class="strip-label">VIDEO</div>
        <video id="playback-video" src="assets/king-kong.mov" muted playsinline loop preload="auto"></video>
        <div id="progress-bar"><div id="progress-fill"></div></div>
      </div>
    </div>

    <!-- Bottom-left: cam + stats -->
    <div id="bottom-bar">
      <div id="cam-section">
        <div class="strip-label">CAM</div>
        <div id="cam-view">
          <video id="webcam-video" muted autoplay playsinline></video>
          <canvas id="overlay-canvas"></canvas>
          <div id="start-overlay">
            <button id="start-btn">시작</button>
          </div>
          <div id="error-msg"></div>
        </div>
      </div>
      <div id="stats">
        <div class="stat-row">
          <span class="stat-lbl">DISTANCE</span>
          <span class="stat-val" id="stat-distance">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-lbl">SPEED</span>
          <span class="stat-val" id="stat-speed">0.0x</span>
        </div>
        <div class="stat-row">
          <span class="stat-lbl">TIME</span>
          <span class="stat-val" id="stat-time">0.0s</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script type="module" src="script.ts"></script>
  <script type="module" src="/common/touch-cursor.ts"></script>
</body>
</html>
