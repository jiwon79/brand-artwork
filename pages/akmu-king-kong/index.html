<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AKMU - King Kong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="main-area">

    <div id="panels">
      <!-- Webcam Panel -->
      <div id="webcam-panel" class="panel">
        <video id="webcam-video" muted autoplay playsinline></video>
        <canvas id="overlay-canvas"></canvas>
        <span class="panel-label">WEBCAM</span>
        <div id="start-overlay">
          <button id="start-btn">카메라 시작</button>
        </div>
        <div id="error-msg"></div>
      </div>

      <!-- Video Panel -->
      <div id="video-panel" class="panel">
        <video id="playback-video" src="assets/king-kong.mov" muted playsinline loop preload="auto"></video>
        <span class="panel-label">VIDEO</span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">
      <div id="hand-dot"></div>
      <div class="stat">
        <span class="stat-val" id="stat-distance">—</span>
        <span class="stat-lbl">DISTANCE</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="stat-val" id="stat-speed">0.0x</span>
        <span class="stat-lbl">SPEED</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="stat-val" id="stat-time">0.0s</span>
        <span class="stat-lbl">TIME</span>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script type="module" src="script.ts"></script>
  <script type="module" src="/common/touch-cursor.ts"></script>
</body>
</html>
