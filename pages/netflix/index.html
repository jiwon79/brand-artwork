<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Netflix Warp Tunnel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Arial Black', Arial, sans-serif;
}
#app {
  position: relative;
  width: 393px;
  height: 852px;
  overflow: hidden;
  background: #000;
}
#canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}
/* DOM card layer */
#cards-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 2;
}
.card-el {
  position: absolute;
  top: 0; left: 0;
  width: 520px;
  height: 338px;
  transform-origin: center center;
  pointer-events: auto;
  overflow: hidden;
  border-radius: 2px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.card-el img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

.card-meta {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 5px 8px 7px;
  background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%);
  pointer-events: none;
}
.card-title-text {
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-family: 'Arial Black', Arial, sans-serif;
  line-height: 1.2;
}
/* Slider */
/* ── Fader slider ── */
#slider-container {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 52px;
  height: 300px;
  z-index: 10;
  cursor: pointer;
  user-select: none;
  opacity: 0.88;
}
#slider-container .ticks {
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  transform: translateX(-50%);
  width: 34px;
  pointer-events: none;
}
#slider-container .tick {
  position: absolute;
  left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transform: translateY(-50%);
}
#slider-container .tick-line {
  height: 1px;
  width: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 1px;
}
#slider-container .tick-line.major { width: 7px; background: rgba(255,255,255,0.18); }
#slider-container .track {
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  transform: translateX(-50%);
  width: 2px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
}
#slider-fill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  border-radius: 2px;
  background: linear-gradient(to top, rgba(229,9,20,0.9), rgba(229,9,20,0.2));
  pointer-events: none;
  box-shadow: 0 0 6px rgba(229,9,20,0.4);
}
#slider-thumb {
  position: absolute;
  left: 50%;
  transform: translate(-50%, 50%);
  width: 52px;
  height: 28px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.18);
  border-top-color: rgba(255,255,255,0.3);
  border-radius: 8px;
  cursor: grab;
  box-shadow:
    0 2px 12px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.12);
  transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  z-index: 10;
  bottom: 0;
}
#slider-thumb:active { cursor: grabbing; }
#slider-thumb.active {
  background: rgba(229,9,20,0.18);
  border-color: rgba(229,9,20,0.6);
  border-top-color: rgba(229,9,20,0.8);
  box-shadow:
    0 0 18px rgba(229,9,20,0.35),
    0 2px 12px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.1);
}
#slider-thumb .grip {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 1.5px;
  background: rgba(255,255,255,0.25);
  border-radius: 1px;
}
#slider-thumb .grip:nth-child(1) { top:  7px; }
#slider-thumb .grip:nth-child(2) { top: 12px; width: 20px; background: rgba(229,9,20,0.7); }
#slider-thumb .grip:nth-child(3) { top: 17px; }
/* Vignette overlay */
#vignette {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  background: radial-gradient(ellipse at center, transparent 40%, #E50914 100%);
  mix-blend-mode: screen;
}
/* Detail overlay */
/* Grain overlay */
#grain {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 8;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="cards-layer"></div>

  <div id="grain"></div>
  <div id="vignette"></div>

  <div id="slider-container">
    <div class="ticks" id="slider-ticks"></div>
    <div class="track">
      <div id="slider-fill"></div>
    </div>
    <div id="slider-thumb">
      <div class="grip"></div>
      <div class="grip"></div>
      <div class="grip"></div>
    </div>
  </div>


</div>

<script type="module" src="script.js"></script>
<script type="module" src="/touch-cursor.ts"></script>
</body>
</html>
