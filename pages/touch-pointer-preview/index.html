<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f3" />
    <title>Touch Pointer Preview</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="preview" data-preview-surface>
      <header class="toolbar" data-touch-cursor-ignore="true">
        <div>
          <p class="eyebrow">Common module</p>
          <h1>Touch Pointer</h1>
        </div>
        <div class="palette" aria-label="포인터 색상">
          <button
            class="swatch is-selected"
            type="button"
            data-pointer-color="#0d99ff"
            aria-label="Figma blue"
            aria-pressed="true"
          ></button>
          <button
            class="swatch swatch--graphite"
            type="button"
            data-pointer-color="#202124"
            aria-label="Graphite"
            aria-pressed="false"
          ></button>
          <button
            class="swatch swatch--magenta"
            type="button"
            data-pointer-color="#f24e9c"
            aria-label="Magenta"
            aria-pressed="false"
          ></button>
        </div>
      </header>

      <section class="canvas canvas--light">
        <span>Light canvas</span>
      </section>
      <section class="canvas canvas--dark">
        <span>Dark canvas</span>
      </section>

      <div class="guide" aria-hidden="true">
        <span class="guide__line"></span>
        <p>마우스를 움직이거나 화면을 터치해 보세요</p>
        <output data-pointer-coordinates>000, 000</output>
      </div>

      <aside class="ignored" data-touch-cursor-ignore="true">
        <strong>Ignored area</strong>
        <span>native cursor</span>
      </aside>
    </main>
    <script type="module" src="./script.ts"></script>
  </body>
</html>
