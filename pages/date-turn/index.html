<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdfdfd">
  <meta name="description" content="14, 09, 26. 파란 숫자가 돌아가는 작은 입체 타이포그래피.">
  <title>Date Turn</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="artwork" tabindex="0" aria-label="Date Turn, 14·09·26 회전 애니메이션" aria-describedby="instructions">
    <canvas id="canvas" aria-hidden="true"></canvas>
  </main>
  <div class="view-buttons">
    <button id="inspect-toggle" type="button" aria-expanded="false" aria-controls="inspection">3D 디버그</button>
    <button id="settings-toggle" type="button" aria-expanded="false">설정</button>
  </div>
  <section id="inspection" aria-label="3D 구조 보기" hidden>
    <strong>3D 구조 보기</strong>
    <p>드래그해서 회전 · 정면에서 경계 비교</p>
    <div class="inspect-presets" aria-label="관찰 각도">
      <button type="button" data-view="0">1면 정면</button>
      <button type="button" data-view="1">2면 정면</button>
      <button type="button" data-view="2">3면 정면</button>
      <button type="button" data-view="oblique">사선</button>
    </div>
    <label>보기 방식 <select id="inspect-mode" aria-label="보기 방식">
      <option value="1">음영 표면</option><option value="2">표면 방향</option><option value="3">경계만</option>
    </select></label>
    <label>표면 구성 <select id="inspect-part" aria-label="표면 구성">
      <option value="0">전체</option><option value="1">몸통만</option><option value="2">숫자 지지부만</option>
    </select></label>
    <div class="inspect-layers">
      <label><input type="checkbox" data-layer="inspectGlyphs" checked> 숫자 경계</label>
      <label><input type="checkbox" data-layer="inspectHousing" checked> 몸통 입력 경계</label>
      <label><input type="checkbox" data-layer="inspectGrid" checked> 좌표 격자</label>
      <label><input type="checkbox" data-layer="inspectHidden" checked> 뒤쪽 경계</label>
    </div>
    <div class="inspect-legend"><span data-face="0"></span><span data-face="1"></span><span data-face="2"></span></div>
    <p>실선: 숫자 · 점선: 몸통 입력 + 여백</p>
    <p id="inspect-explanation">최종 거리장 표면에 음영을 계산합니다.</p>
    <p class="inspect-note">글꼴 → 768×768 거리장 → 곡면 합성<br>격자는 좌표 표시이며, 삼각형 메시가 아닙니다.<br>점선은 입력 경계이며, 최종 몸통 외곽과 다릅니다.</p>
  </section>
  <p id="instructions" class="sr-only">드래그하면 입체를 자유롭게 회전합니다. 클릭 또는 스페이스 키로 자동 회전을 전환합니다. 방향키로 회전하고 R 키로 기본값을 복원합니다. 설정에서 세 면의 숫자, 크기, 감도와 색상을 바꿀 수 있습니다.</p>
  <p id="status" class="sr-only" role="status"></p>
  <script type="module" src="./script.ts"></script>
</body>
</html>
