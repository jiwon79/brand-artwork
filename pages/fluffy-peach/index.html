<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4162e2" />
    <title>Fluffy Peach</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="artwork" aria-label="떠 있는 솜털 캐릭터"></canvas>
    <div id="variant-picker" role="group" aria-label="형태와 색감 선택">
      <button type="button" data-variant="original" aria-pressed="false" style="--swatch:#ffb8a3"><span class="swatch"></span>기존</button>
      <button type="button" data-variant="bean" aria-pressed="false" style="--swatch:#b4e6bb"><span class="swatch"></span>민트 콩</button>
      <button type="button" data-variant="flower" aria-pressed="false" style="--swatch:#ffc17d"><span class="swatch"></span>꿀 꽃</button>
      <button type="button" data-variant="star" aria-pressed="true" style="--swatch:#9aa9f3"><span class="swatch"></span>보라 별</button>
      <button type="button" data-variant="wave" aria-pressed="false" style="--swatch:#a1e2e9"><span class="swatch"></span>파도</button>
    </div>
    <button id="editor-toggle" type="button" aria-controls="motion-editor" aria-expanded="false">모션 편집</button>
    <div id="contour-measurement" aria-live="off" hidden>원본 윤곽 <span></span></div>
    <section id="motion-editor" aria-label="모션 편집기" hidden>
      <div class="editor-header">
        <div class="editor-heading"><strong>MOTION EDITOR</strong><span id="editor-shape">보라 별</span></div>
        <div class="editor-transport" role="group" aria-label="재생 제어">
          <button type="button" data-action="previous-frame" aria-label="이전 프레임">‹</button>
          <button type="button" data-action="play" aria-label="재생">▶</button>
          <button type="button" data-action="next-frame" aria-label="다음 프레임">›</button>
          <output id="editor-timecode" aria-live="off">00:00:00</output>
          <span class="editor-frame-info" id="editor-source-frame">원본 001</span>
        </div>
        <div class="editor-header-controls">
          <label>속도 <select id="editor-speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
          <label>확대 <input id="editor-zoom" type="range" min="1" max="4" step="0.25" value="1" /></label>
          <button type="button" data-action="compare" aria-pressed="false">원본 비교</button>
          <button type="button" data-action="mesh-view" aria-pressed="false">메시 보기</button>
        </div>
      </div>
      <div class="editor-timeline">
        <div class="editor-labels" aria-hidden="true">
          <div class="editor-label editor-ruler-label">시간</div>
          <div class="editor-label editor-source-label" title="원본 영상에서 측정한 가로 폭. 클립에서 가장 좁은 순간이 0%, 가장 넓은 순간이 100%">원본 가로폭 <output id="editor-source-width">0%</output></div>
          <div class="editor-label editor-contour-label">윤곽 64 <output id="editor-contour-value">#01 · 0.0px</output></div>
          <div class="editor-label" data-label="response">형태 반응 <output>1.00×</output></div>
          <div class="editor-label" data-label="sway">좌우 이동 <output>0px</output></div>
          <div class="editor-label" data-label="lift">높이 <output>0px</output></div>
          <div class="editor-label" data-label="tilt">기울기 <output>0°</output></div>
        </div>
        <div id="editor-scroll" class="editor-scroll">
          <div id="editor-content" class="editor-content">
            <div id="editor-ruler" class="editor-ruler" aria-label="시간축"></div>
            <div id="editor-source" class="editor-source" aria-label="원본 영상에서 측정한 가로 폭 변화. 아래로 갈수록 좁고 위로 갈수록 넓음"></div>
            <div id="editor-contours" class="editor-contours" role="group" aria-label="원본 윤곽의 64방향 거리 변화. 가로는 시간, 세로는 방향 1부터 64까지. 누르거나 드래그하여 방향과 시간을 선택"><canvas id="editor-contour-canvas" aria-hidden="true"></canvas><div id="editor-contour-selection" aria-hidden="true"></div></div>
            <div class="editor-lane" data-lane="response" aria-label="형태 반응 키프레임"></div>
            <div class="editor-lane" data-lane="sway" aria-label="좌우 이동 키프레임"></div>
            <div class="editor-lane" data-lane="lift" aria-label="높이 키프레임"></div>
            <div class="editor-lane" data-lane="tilt" aria-label="기울기 키프레임"></div>
            <div id="editor-playhead" aria-hidden="true"></div>
          </div>
        </div>
      </div>
      <div class="editor-inspector">
        <label>윤곽 방향 <input id="editor-contour-index" type="number" min="1" max="64" step="1" value="1" /></label>
        <label>트랙 <select id="editor-track"><option value="response">형태 반응</option><option value="sway">좌우 이동</option><option value="lift">높이</option><option value="tilt">기울기</option></select></label>
        <label>프레임 <input id="editor-keyframe-time" type="number" min="0" step="1" /></label>
        <label>값 <input id="editor-keyframe-value" type="number" step="0.05" /></label>
        <button type="button" data-action="add-keyframe">◆ 추가</button>
        <button type="button" data-action="delete-keyframe">삭제</button>
        <div class="editor-spacer"></div>
        <button type="button" data-action="reset">초기화</button>
        <button type="button" data-action="export">JSON 저장</button>
        <button type="button" data-action="import">불러오기</button>
        <input id="editor-file" type="file" accept="application/json,.json" hidden />
      </div>
      <p class="editor-help">윤곽 64: 세로가 방향 #01–64, 가로가 시간입니다. 짙은 청록은 짧고 밝은 살구는 긴 거리입니다. 값은 원본 영상의 중심에서 잰 720px 기준 거리이며, 메시 보기의 살구색 선도 같은 측정값입니다. 회색 메시에는 형태별 변형이 추가됩니다.</p>
    </section>
    <script type="module" src="./script.ts"></script>
  </body>
</html>
