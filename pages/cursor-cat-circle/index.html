<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Cursor Cat Circle</title>
  <link rel="stylesheet" href="/pages/cursor-cat-circle/style.css">
</head>
<body>
  <main
    id="cat-stage"
    class="cat-stage"
    tabindex="0"
    aria-busy="true"
    aria-label="커서 위치에 따라 오른쪽에서 위쪽을 지나 왼쪽까지 시선을 움직이는 주황색 고양이"
  >
    <div class="cat-wrap">
      <img
        id="cat-frame"
        class="cat-frame"
        src="/pages/cursor-cat-circle/assets/upper-arc-frames/frame-001.webp"
        alt=""
        draggable="false"
        decoding="async"
        fetchpriority="high"
      >
    </div>

    <canvas
      id="debug-canvas"
      class="debug-canvas"
      aria-hidden="true"
    ></canvas>

    <p id="loading-status" class="loading-status" role="status" aria-live="polite">
      이미지 로딩 중…
    </p>
  </main>

  <script type="module" src="/common/touch-pointer.ts"></script>
  <script type="module" src="/pages/cursor-cat-circle/script.ts"></script>
</body>
</html>
