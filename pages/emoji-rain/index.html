<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emoji Rain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #E8DDD0;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }

    #canvas-wrap {
      position: relative;
      flex-shrink: 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 56px rgba(0,0,0,0.18);
    }

    canvas {
      display: block;
      cursor: none;
    }

    #cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      border: 2px solid #FF7A00;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: multiply;
      transform: translate(-50%, -50%);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #swipe-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease-out;
      z-index: 100;
      border-radius: 20px;
    }

    #intro {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: none;
    }

    #intro-emoji {
      font-size: 100px;
      line-height: 1;
      opacity: 0;
      animation: floatIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.75);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #intro.fade-out {
      animation: introFadeOut 0.4s ease-out forwards;
    }

    @keyframes introFadeOut {
      to {
        opacity: 0;
        transform: scale(1.08);
      }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="swipe-flash"></div>
    <div id="intro">
      <span id="intro-emoji">🫪</span>
    </div>
  </div>
  <div id="cursor"></div>
  <script type="module" src="./script.ts"></script>
</body>
</html>
