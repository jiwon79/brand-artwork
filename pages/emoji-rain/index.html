<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emoji Rain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #E8DDD0;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* overrides on supporting browsers (Safari 15.4+) */
    }

    #canvas-wrap {
      position: relative;
      flex-shrink: 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 56px rgba(0,0,0,0.18);
    }

    canvas {
      display: block;
      cursor: none;
    }

    #cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      border: 2px solid #FF7A00;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: multiply;
      transform: translate(-50%, -50%);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #swipe-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease-out;
      z-index: 100;
      border-radius: 20px;
    }

    #intro {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: none;
    }

    #intro-emoji {
      font-size: 100px;
      line-height: 1;
      opacity: 0;
      animation: floatIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.75);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #intro.fade-out {
      animation: introFadeOut 0.4s ease-out forwards;
    }

    @keyframes introFadeOut {
      to {
        opacity: 0;
        transform: scale(1.08);
      }
    }

    #gravity-control {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(255, 248, 240, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.13);
      font: 13px/1 system-ui, sans-serif;
      color: #7a5c3a;
      z-index: 9000;
      user-select: none;
      white-space: nowrap;
    }

    #gravity-slider {
      width: 110px;
      accent-color: #FF7A00;
      cursor: pointer;
    }

    #gravity-value {
      min-width: 30px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="swipe-flash"></div>
    <div id="intro">
      <span id="intro-emoji">🫪</span>
    </div>
  </div>
  <div id="cursor"></div>
  <div id="gravity-control">
    <span>중력</span>
    <input type="range" id="gravity-slider" min="0.1" max="2.0" step="0.05" value="0.5">
    <span id="gravity-value">0.50</span>
  </div>
  <script type="module" src="./script.ts"></script>
</body>
</html>
