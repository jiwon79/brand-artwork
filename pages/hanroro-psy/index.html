<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>0+0 — 한로로 × 강남스타일</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Major+Mono+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="center">
      <div class="lp-wrap">
        <div class="lp-shadow"></div>
        <div class="lp" id="lp">
          <div class="label">
            <div class="label-text" id="labelText">0+0</div>
            <div class="label-sub">자몽살구클럽</div>
          </div>
          <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
          <div class="pin"></div>
        </div>
        <div class="tonearm" id="tonearm"></div>
      </div>

      <div class="fx-grid">
        <button class="fx-btn" data-fx="loop"><span class="ko">루프</span></button>
        <button class="fx-btn" data-fx="reverse"><span class="ko">리버스</span></button>
        <button class="fx-btn" data-fx="filter"><span class="ko">필터</span></button>
        <button class="fx-btn" data-fx="echo"><span class="ko">에코</span></button>
      </div>
    </div>

    <div class="pad-grid">
      <button class="pad row-gangnam" data-sound="gangnam"><span class="label-ko">강남</span></button>
      <button class="pad row-gangnam" data-sound="ingan"><span class="label-ko">인간</span></button>
      <button class="pad row-gangnam" data-sound="yeoja"><span class="label-ko">여자</span></button>
      <button class="pad row-gangnam" data-sound="ssanai"><span class="label-ko">싸나이</span></button>
      <button class="pad row-fart" data-sound="op"><span class="label-ko">옵</span></button>
      <button class="pad row-fart" data-sound="wanjeon"><span class="label-ko">완전</span></button>
      <button class="pad row-fart" data-sound="ultungbultung"><span class="label-ko">울퉁불퉁한</span></button>
      <button class="pad row-fart" data-sound="eo"><span class="label-ko">어</span></button>
      <button class="pad row-hanroro" data-sound="zero"><span class="label-ko">0+0 후렴</span></button>
      <button class="pad row-hanroro" data-sound="guitar"><span class="label-ko">기타</span></button>
      <button class="pad row-hanroro" data-sound="sigh"><span class="label-ko">한숨</span></button>
      <button class="pad row-hanroro" data-sound="love"><span class="label-ko">사랑해요</span></button>
    </div>
  </div>

  <script type="module" src="script.ts"></script>
  <script type="module" src="/common/touch-cursor.ts"></script>
</body>
</html>
