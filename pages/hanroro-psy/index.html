<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>0+0 — 한로로 × 강남스타일</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Major+Mono+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="center">
      <div class="lp-wrap">
        <div class="lp-shadow"></div>
        <div class="lp" id="lp">
          <div class="label">
            <div class="label-text" id="labelText">0+0</div>
            <div class="label-sub">자몽살구클럽</div>
          </div>
          <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
          <div class="pin"></div>
        </div>
        <div class="tonearm" id="tonearm"></div>
      </div>

      <div class="fx-grid">
        <button class="fx-btn" data-fx="loop"><span class="ko">루프</span><span class="en">LOOP</span></button>
        <button class="fx-btn" data-fx="reverse"><span class="ko">리버스</span><span class="en">REV</span></button>
        <button class="fx-btn" data-fx="filter"><span class="ko">필터</span><span class="en">FLTR</span></button>
        <button class="fx-btn" data-fx="echo"><span class="ko">에코</span><span class="en">ECHO</span></button>
      </div>
    </div>

    <div class="pad-grid">
      <button class="pad row-gangnam" data-sound="op"><span class="label-ko">옵</span><span class="label-en">OP</span></button>
      <button class="pad row-gangnam" data-sound="ehy"><span class="label-ko">에~</span><span class="label-en">EHY</span></button>
      <button class="pad row-gangnam" data-sound="sexy"><span class="label-ko">섹시레이디</span><span class="label-en">SEXY</span></button>
      <button class="pad row-gangnam" data-sound="damn"><span class="label-ko">댐걸</span><span class="label-en">DAMN</span></button>
      <button class="pad row-fart" data-sound="fart1"><span class="emoji">💨</span><span class="label-en">FART·S</span></button>
      <button class="pad row-fart" data-sound="fart2"><span class="emoji">💨💨</span><span class="label-en">FART·L</span></button>
      <button class="pad row-fart" data-sound="sanae"><span class="label-ko">사나에</span><span class="label-en">SANAE</span></button>
      <button class="pad row-fart" data-sound="oppa"><span class="label-ko">오빠달린다</span><span class="label-en">OPPA</span></button>
      <button class="pad row-hanroro" data-sound="zero"><span class="label-ko">0+0 후렴</span><span class="label-en">CHORUS</span></button>
      <button class="pad row-hanroro" data-sound="guitar"><span class="label-ko">기타</span><span class="label-en">GUITAR</span></button>
      <button class="pad row-hanroro" data-sound="sigh"><span class="label-ko">한숨</span><span class="label-en">SIGH</span></button>
      <button class="pad row-hanroro" data-sound="love"><span class="label-ko">사랑해요</span><span class="label-en">LOVE</span></button>
    </div>
  </div>

  <script type="module" src="script.ts"></script>
  <script type="module" src="/common/touch-cursor.ts"></script>
</body>
</html>
