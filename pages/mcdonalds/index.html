<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<base href="/pages/mcdonalds/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BIG MAC BURST</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0a00;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
  }
  canvas { display: block; touch-action: none; position: fixed; top: 0; left: 0; }

#overlay {
position: fixed; inset: 0;
pointer-events: none;
z-index: 10;
}
#vignette {
position: fixed; inset: 0;
background: radial-gradient(ellipse at center, transparent 40%, rgba(180,0,0,0) 100%);
transition: background 0.1s;
pointer-events: none;
z-index: 5;
}

#copy {
position: fixed;
bottom: 60px;
left: 0; right: 0;
text-align: center;
z-index: 15;
pointer-events: none;
transition: opacity 0.4s;
}
#copyText {
font-family: 'Bebas Neue', sans-serif;
font-size: clamp(22px, 5vw, 38px);
letter-spacing: 2px;
color: #fff;
text-shadow: 0 2px 20px rgba(0,0,0,0.8);
}
#copySmall {
font-family: 'Bebas Neue', sans-serif;
font-size: 13px;
letter-spacing: 1px;
color: rgba(255,255,255,0.4);
margin-top: 8px;
}
#pressBar {
position: fixed;
bottom: 130px;
left: 50%;
transform: translateX(-50%);
width: 200px;
height: 3px;
background: rgba(255,255,255,0.1);
border-radius: 2px;
z-index: 15;
pointer-events: none;
opacity: 0;
transition: opacity 0.3s;
}
#pressBarFill {
height: 100%;
width: 0%;
background: linear-gradient(90deg, #FFC72C, #FF0000);
border-radius: 2px;
transition: width 0.05s;
}
#ingredientTag {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
font-family: 'Bebas Neue', sans-serif;
font-size: 18px;
letter-spacing: 5px;
white-space: nowrap;
color: #FFC72C;
background: rgba(0,0,0,0.6);
padding: 6px 16px;
border: 1px solid rgba(255,199,44,0.3);
opacity: 0;
z-index: 15;
pointer-events: none;
transition: opacity 0.2s;
}
</style>

</head>
<body>

<div id="vignette"></div>
<div id="copy">
  <div id="copyText">I'm lovin it Macdonald 🍔</div>
  <div id="copySmall">Tap to burst</div>
</div>
<div id="pressBar"><div id="pressBarFill"></div></div>
<div id="ingredientTag"></div>
<canvas id="c"></canvas>

<script type="module" src="burst.js"></script>
<script type="module" src="/touch-cursor.ts"></script>

</body>
</html>
