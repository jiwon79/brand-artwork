<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">터치 source packet의 생성, 드래그, 릴리즈 생명주기</title>
  <desc id="desc">왼쪽은 손가락을 누르는 동안 source의 질량과 에너지가 증가하는 상태, 가운데는 source만 새 위치로 이동하고 분리된 packet은 기존 위치에서 낙하하는 상태, 오른쪽은 손을 떼면 공급만 멈추고 모든 packet이 화면 아래로 빠지는 상태다.</desc>
  <defs>
    <style>
      .title { font: 700 27px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; }
      .head { font: 700 18px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .body { font: 400 14px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #5f6f84; text-anchor: middle; }
      .mono { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #315f9f; text-anchor: middle; }
      .panel { fill: #fff; stroke: #d6deea; stroke-width: 1.7; }
      .trail { fill: none; stroke: #4c78c2; stroke-width: 2.2; stroke-dasharray: 6 5; }
    </style>
    <radialGradient id="packet" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#d95d9c" stop-opacity=".82"/>
      <stop offset=".55" stop-color="#7f9ed4" stop-opacity=".64"/>
      <stop offset="1" stop-color="#b8d8f2" stop-opacity=".18"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#66758a"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4c78c2"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#fbfbfa"/>
  <text class="title" x="44" y="50">손가락은 물을 공급하는 source이고, 떨어진 packet은 자기 상태로 계속 움직인다</text>

  <g transform="translate(38 86)">
    <rect class="panel" width="348" height="454" rx="20"/>
    <text class="head" x="174" y="38">1. Hold · 첫 packet 형성</text>
    <text class="body" x="174" y="62">source 위치에서 mass와 energy가 증가한다</text>
    <g transform="translate(64 100)">
      <circle cx="110" cy="35" r="24" fill="none" stroke="#172033" stroke-width="2"/>
      <circle cx="110" cy="35" r="4" fill="#172033"/>
      <line x1="110" y1="61" x2="110" y2="94" stroke="#66758a" stroke-width="2" marker-end="url(#arrow)"/>
      <ellipse cx="110" cy="148" rx="32" ry="46" fill="url(#packet)"/>
      <ellipse cx="110" cy="148" rx="58" ry="82" fill="none" stroke="#4c78c2" stroke-opacity=".35"/>
      <text class="mono" x="110" y="247">mass: 0 → 1</text>
      <text class="mono" x="110" y="272">energy: 0 → 1에 접근</text>
    </g>
    <text class="body" x="174" y="397">첫 mass 1은 0.13초 동안 채워지고</text>
    <text class="body" x="174" y="421">energy는 0.36초 time constant로 증가한다</text>
  </g>

  <path d="M398 313H425" stroke="#66758a" stroke-width="2.3" marker-end="url(#arrow)"/>

  <g transform="translate(426 86)">
    <rect class="panel" width="348" height="454" rx="20"/>
    <text class="head" x="174" y="38">2. Drag · source만 이동</text>
    <text class="body" x="174" y="62">분리된 packet은 새 포인터를 따라가지 않는다</text>
    <g transform="translate(42 95)">
      <path d="M52 42C94 8 146 29 207 55" class="trail" marker-end="url(#blueArrow)"/>
      <circle cx="48" cy="43" r="17" fill="none" stroke="#98a6b9"/>
      <text class="mono" x="48" y="72">A</text>
      <circle cx="216" cy="58" r="22" fill="none" stroke="#172033" stroke-width="2"/>
      <circle cx="216" cy="58" r="4" fill="#172033"/>
      <text class="mono" x="216" y="91">현재 source B</text>
      <ellipse cx="54" cy="139" rx="38" ry="54" fill="url(#packet)"/>
      <ellipse cx="73" cy="227" rx="28" ry="67" fill="url(#packet)" opacity=".8"/>
      <ellipse cx="210" cy="139" rx="40" ry="55" fill="url(#packet)"/>
      <path d="M54 171V204M210 175V211" stroke="#4c78c2" stroke-width="2" marker-end="url(#blueArrow)"/>
    </g>
    <text class="body" x="174" y="397">A에서 나온 물은 A 아래로 떨어지고</text>
    <text class="body" x="174" y="421">B의 source에서 새 물이 동시에 시작된다</text>
  </g>

  <path d="M786 313H813" stroke="#66758a" stroke-width="2.3" marker-end="url(#arrow)"/>

  <g transform="translate(814 86)">
    <rect class="panel" width="348" height="454" rx="20"/>
    <text class="head" x="174" y="38">3. Release · 공급만 중단</text>
    <text class="body" x="174" y="62">packet은 fade 없이 화면 아래 출구로 흐른다</text>
    <g transform="translate(54 90)">
      <circle cx="120" cy="35" r="24" fill="none" stroke="#98a6b9" stroke-width="1.5" stroke-dasharray="5 4"/>
      <line x1="103" y1="18" x2="137" y2="52" stroke="#d45992" stroke-width="2.5"/>
      <line x1="137" y1="18" x2="103" y2="52" stroke="#d45992" stroke-width="2.5"/>
      <ellipse cx="120" cy="104" rx="42" ry="52" fill="url(#packet)"/>
      <ellipse cx="109" cy="194" rx="31" ry="60" fill="url(#packet)" opacity=".82"/>
      <path d="M120 145V164M109 238V270" stroke="#4c78c2" stroke-width="2" marker-end="url(#blueArrow)"/>
      <line x1="22" y1="274" x2="218" y2="274" stroke="#66758a" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text class="mono" x="120" y="296">off-screen sink</text>
    </g>
    <text class="body" x="174" y="414">중앙에서 줄이거나 수명으로 지우지 않는다</text>
    <text class="body" x="174" y="438">Falloff 전체가 아래로 나가면 배열에서 제거한다</text>
  </g>
</svg>
