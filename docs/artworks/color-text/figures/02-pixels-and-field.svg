<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">활성 글자 픽셀에서 액체 field가 만들어지는 과정</title>
  <desc id="desc">글자 위에 구슬을 배치하지 않고, 각 출력 픽셀이 주변의 활성 글자 픽셀을 황금각 측정점으로 조사해 field와 경계를 만드는 세 단계</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#5b6675"/>
    </marker>
    <radialGradient id="field" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#4c78c2" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#4c78c2" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4c78c2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 700 29px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; }
      .head { font: 700 21px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .body { font: 400 16px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #5b6675; text-anchor: middle; }
      .panel { fill: #f7f9fc; stroke: #c7cfda; stroke-width: 2; }
      .pixel { fill: #4c78c2; }
      .probe { fill: #ffffff; stroke: #7e8997; stroke-width: 2; }
      .hit { fill: #4c78c2; stroke: #315f9f; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text class="title" x="48" y="55">구슬을 놓는 대신, 출력 픽셀마다 주변 활성 픽셀을 측정한다</text>

  <rect class="panel" x="40" y="92" width="330" height="440" rx="22"/>
  <text class="head" x="205" y="137">1. 활성 글자 픽셀</text>
  <path d="M112 205 L205 307 L298 205 M205 307 L205 449" fill="none" stroke="#dce3ec" stroke-width="42" stroke-linecap="square" stroke-linejoin="round"/>
  <g class="pixel">
    <rect x="102" y="194" width="18" height="18" opacity=".9"/>
    <rect x="119" y="212" width="18" height="18" opacity=".92"/>
    <rect x="136" y="230" width="18" height="18" opacity=".95"/>
    <rect x="153" y="248" width="18" height="18"/>
    <rect x="170" y="266" width="18" height="18"/>
    <rect x="187" y="284" width="18" height="18"/>
    <rect x="290" y="194" width="18" height="18" opacity=".88"/>
    <rect x="273" y="212" width="18" height="18" opacity=".92"/>
    <rect x="256" y="230" width="18" height="18" opacity=".96"/>
    <rect x="239" y="248" width="18" height="18"/>
    <rect x="222" y="266" width="18" height="18"/>
    <rect x="205" y="284" width="18" height="18"/>
    <rect x="196" y="302" width="18" height="18"/>
    <rect x="196" y="320" width="18" height="18" opacity=".98"/>
    <rect x="196" y="338" width="18" height="18" opacity=".96"/>
    <rect x="196" y="356" width="18" height="18" opacity=".93"/>
    <rect x="196" y="374" width="18" height="18" opacity=".9"/>
    <rect x="196" y="392" width="18" height="18" opacity=".86"/>
    <rect x="196" y="410" width="18" height="18" opacity=".82"/>
    <rect x="196" y="428" width="18" height="18" opacity=".78"/>
  </g>
  <text class="body" x="205" y="482">각 칸에 0~1의 활성값이 저장된다.</text>
  <text class="body" x="205" y="507">중심선이나 구슬 목록은 만들지 않는다.</text>

  <path d="M382 310 H410" fill="none" stroke="#5b6675" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="panel" x="425" y="92" width="350" height="440" rx="22"/>
  <text class="head" x="600" y="137">2. 출력 픽셀 p의 주변 조사</text>
  <circle cx="600" cy="315" r="132" fill="#eef2f7" stroke="#aab4c1" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M500 205 L600 315 L700 205 M600 315 L600 449" fill="none" stroke="#4c78c2" stroke-opacity=".2" stroke-width="34" stroke-linecap="round"/>
  <g>
    <circle class="probe" cx="608" cy="296" r="5"/>
    <circle class="hit" cx="579" cy="303" r="5"/>
    <circle class="probe" cx="617" cy="330" r="5"/>
    <circle class="hit" cx="606" cy="273" r="5"/>
    <circle class="probe" cx="557" cy="324" r="5"/>
    <circle class="probe" cx="643" cy="285" r="5"/>
    <circle class="hit" cx="596" cy="354" r="5"/>
    <circle class="probe" cx="550" cy="277" r="5"/>
    <circle class="probe" cx="660" cy="340" r="5"/>
    <circle class="hit" cx="528" cy="342" r="5"/>
    <circle class="probe" cx="635" cy="377" r="5"/>
    <circle class="probe" cx="585" cy="237" r="5"/>
    <circle class="probe" cx="690" cy="284" r="5"/>
    <circle class="hit" cx="548" cy="389" r="5"/>
    <circle class="probe" cx="638" cy="224" r="5"/>
    <circle class="probe" cx="696" cy="365" r="5"/>
    <circle class="probe" cx="505" cy="288" r="5"/>
    <circle class="hit" cx="593" cy="411" r="5"/>
    <circle class="probe" cx="671" cy="405" r="5"/>
    <circle class="probe" cx="516" cy="228" r="5"/>
    <circle class="probe" cx="723" cy="317" r="5"/>
    <circle class="probe" cx="486" cy="376" r="5"/>
  </g>
  <circle cx="600" cy="315" r="9" fill="#e05252"/>
  <text class="body" x="600" y="476">황금각으로 배치한 측정점에서 활성값을 읽는다.</text>
  <text class="body" x="600" y="501">실제 계산은 출력 픽셀마다 192개를 사용한다.</text>

  <path d="M787 310 H815" fill="none" stroke="#5b6675" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="panel" x="830" y="92" width="330" height="440" rx="22"/>
  <text class="head" x="995" y="137">3. field에서 경계 꺼내기</text>
  <ellipse cx="995" cy="305" rx="133" ry="139" fill="url(#field)"/>
  <path d="M891 230 C909 187 950 188 981 218 C992 229 1000 249 1008 265 C1018 244 1028 227 1043 216 C1077 191 1117 205 1125 244 C1134 286 1098 310 1064 322 C1036 332 1040 371 1047 411 C1054 453 1018 470 994 443 C969 470 934 453 941 411 C948 369 949 333 920 321 C888 308 874 269 891 230Z" fill="#dce6f6" stroke="#4c78c2" stroke-width="4"/>
  <path d="M962 230 C975 249 985 277 995 298 C1005 277 1016 249 1029 230" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <path d="M995 289 C980 326 981 365 995 393 C1009 365 1010 326 995 289Z" fill="#ffffff"/>
  <text class="body" x="995" y="482">field가 기준값보다 높은 픽셀만 남긴다.</text>
  <text class="body" x="995" y="507">그 결과가 하나로 이어진 액체 실루엣이다.</text>

  <text class="body" x="600" y="581">측정점은 구슬의 중심이 아니다. 각 출력 픽셀이 주변 활성 픽셀을 읽기 위한 탐침이다.</text>
</svg>
