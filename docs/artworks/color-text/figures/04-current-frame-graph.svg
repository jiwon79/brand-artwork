<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Color Text 한 프레임의 CPU 상태, GPU field, 출력과 피드백</title>
  <desc id="desc">왼쪽 패널은 포인터와 물 packet을 갱신하는 CPU, 가운데 패널은 변형 글자에서 interaction, geometry field와 가까운 글자 seed를 만드는 GPU, 오른쪽 패널은 최종 출력과 다음 프레임 글자 spring 피드백을 보여준다.</desc>
  <defs>
    <style>
      .title { font: 700 27px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; }
      .head { font: 700 18px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .label { font: 700 15px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 400 13px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #607086; text-anchor: middle; }
      .mono { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #315f9f; text-anchor: middle; }
      .panel { fill: #fff; stroke: #d6deea; stroke-width: 1.7; }
      .box { fill: #f7f9fc; stroke: #b8c5d5; stroke-width: 1.5; }
      .blue { fill: #edf4ff; stroke: #6e95ca; }
      .pink { fill: #fff1f7; stroke: #c586aa; }
      .purple { fill: #f4f0ff; stroke: #8c79bd; }
      .arrow { fill: none; stroke: #66758a; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#66758a"/>
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8c79bd"/>
    </marker>
  </defs>

  <rect width="1200" height="590" fill="#fbfbfa"/>
  <text class="title" x="42" y="48">한 프레임은 물의 상태, 픽셀 field, 글자 피드백을 순서대로 연결한다</text>

  <g transform="translate(34 82)">
    <rect class="panel" width="344" height="480" rx="20"/>
    <text class="head" x="172" y="38">1. CPU · 물의 상태</text>
    <g transform="translate(52 76)">
      <rect class="box" width="240" height="62" rx="13"/>
      <text class="label" x="120" y="27">pointerTarget</text>
      <text class="small" x="120" y="47">최신 터치 위치 · UV [0,1]</text>
      <path class="arrow" d="M120 64V91" marker-end="url(#arrow)"/>
      <rect class="box" y="100" width="240" height="62" rx="13"/>
      <text class="label" x="120" y="127">dripEmitter</text>
      <text class="small" x="120" y="147">지수 완화로 source 추종</text>
      <path class="arrow" d="M120 164V191" marker-end="url(#arrow)"/>
      <rect class="box blue" y="200" width="240" height="82" rx="13"/>
      <text class="label" x="120" y="227">liquidParticles ≤ 32</text>
      <text class="small" x="120" y="248">위치 · 속도 · age · mass</text>
      <text class="small" x="120" y="266">gravity · damping · cohesion</text>
      <path class="arrow" d="M120 284V311" marker-end="url(#arrow)"/>
      <rect class="box" y="320" width="240" height="62" rx="13"/>
      <text class="label" x="120" y="347">particle uniforms</text>
      <text class="small" x="120" y="367">GPU에 현재 packet 상태 전달</text>
    </g>
  </g>

  <path class="arrow" d="M390 310H414" marker-end="url(#arrow)"/>

  <g transform="translate(416 82)">
    <rect class="panel" width="368" height="480" rx="20"/>
    <text class="head" x="184" y="38">2. GPU · 픽셀 지도</text>
    <g transform="translate(54 76)">
      <rect class="box" width="260" height="62" rx="13"/>
      <text class="label" x="130" y="27">deformed glyphs</text>
      <text class="small" x="130" y="47">이전 spring으로 글자 이동·회전</text>
      <path class="arrow" d="M130 64V91" marker-end="url(#arrow)"/>
      <rect class="box blue" y="100" width="260" height="74" rx="13"/>
      <text class="label" x="130" y="126">interactionTarget RGBA</text>
      <text class="mono" x="130" y="147">active · text · falloff</text>
      <path class="arrow" d="M82 176V207" marker-end="url(#arrow)"/>
      <path class="arrow" d="M178 176V207" marker-end="url(#arrow)"/>
      <rect class="box blue" y="216" width="124" height="86" rx="13"/>
      <text class="label" x="62" y="243">geometry</text>
      <text class="small" x="62" y="264">192 probes</text>
      <text class="small" x="62" y="283">smooth field</text>
      <rect class="box pink" x="136" y="216" width="124" height="86" rx="13"/>
      <text class="label" x="198" y="243">color</text>
      <text class="small" x="198" y="264">nearest seed</text>
      <text class="small" x="198" y="283">glyph distance</text>
      <path class="arrow" d="M62 304V313" marker-end="url(#arrow)"/>
      <path class="arrow" d="M198 304V313" marker-end="url(#arrow)"/>
      <rect class="box purple" y="322" width="260" height="56" rx="13"/>
      <text class="label" x="130" y="347">surfaceField + nearest seed</text>
      <text class="small" x="130" y="367">최종 합성 · surface는 contact에도 사용</text>
    </g>
  </g>

  <path class="arrow" d="M796 310H820" marker-end="url(#arrow)"/>

  <g transform="translate(822 82)">
    <rect class="panel" width="344" height="480" rx="20"/>
    <text class="head" x="172" y="38">3. 출력 · 다음 프레임</text>
    <g transform="translate(52 92)">
      <rect class="box blue" width="240" height="74" rx="13"/>
      <text class="label" x="120" y="29">Final / Process View</text>
      <text class="small" x="120" y="51">같은 중간 target을 다른 방식으로 표시</text>
      <path class="arrow" d="M120 76V111" marker-end="url(#arrow)"/>
      <rect class="box purple" y="120" width="240" height="88" rx="13"/>
      <text class="label" x="120" y="148">glyph contact</text>
      <text class="small" x="120" y="169">9×9: visible surface × text pixel</text>
      <text class="small" x="120" y="188">좌우 차이로 회전 목표 계산</text>
      <path class="arrow" d="M120 210V245" marker-end="url(#arrow)"/>
      <rect class="box purple" y="254" width="240" height="74" rx="13"/>
      <text class="label" x="120" y="283">64×1 spring state</text>
      <text class="small" x="120" y="305">offset · velocity · angle · ω</text>
      <path d="M50 330V374H-418V44H-366" fill="none" stroke="#8c79bd" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#purpleArrow)"/>
      <text class="small" x="120" y="346">한 프레임 뒤 deformed glyphs로 되먹임</text>
    </g>
  </g>
</svg>
