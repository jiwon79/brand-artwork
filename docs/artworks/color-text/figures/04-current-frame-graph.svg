<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Color Text의 현재 프레임 아키텍처</title>
  <desc id="desc">포인터 입력과 CPU 물 입자 Solver, 글자 변형, Contact 생성, Metaball 실루엣, 최근접 글자 거리와 색 필드, 글자 스프링 피드백, Process View와 Final 출력의 연결 관계</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; }
      .lane { font: 700 15px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #64748b; letter-spacing: .08em; }
      .label { font: 700 16px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 400 13px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #64748b; text-anchor: middle; }
      .channel { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3f5f98; text-anchor: middle; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 1.8; }
      .cpu { fill: #f3f7ff; stroke: #7f9bc9; }
      .gpu { fill: #f8fafc; stroke: #aebacb; }
      .geometry { fill: #edf5ff; stroke: #6e95ca; }
      .color { fill: #fff2f8; stroke: #c586aa; }
      .state { fill: #f4f0ff; stroke: #8c79bd; }
      .output { fill: #172033; stroke: #172033; }
      .output-label { font: 700 17px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #fff; text-anchor: middle; }
      .output-small { font: 400 13px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #dce5f3; text-anchor: middle; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #8c79bd; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .tap { fill: none; stroke: #aebacb; stroke-width: 1.5; stroke-dasharray: 4 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#fbfbfa"/>
  <text class="title" x="48" y="54">현재 한 프레임은 CPU 상태와 GPU 이미지 지도를 순서대로 연결한다</text>

  <rect x="36" y="84" width="1328" height="166" rx="24" fill="#f8fafc" stroke="#d9e1eb"/>
  <text class="lane" x="58" y="115">CPU · INPUT &amp; SOLVER</text>

  <g transform="translate(70 138)">
    <rect class="box cpu" width="190" height="76" rx="15"/>
    <text class="label" x="95" y="31">Pointer Events</text>
    <text class="small" x="95" y="54">down · move · up</text>
  </g>
  <path class="arrow" d="M270 176H322"/>
  <g transform="translate(332 138)">
    <rect class="box cpu" width="190" height="76" rx="15"/>
    <text class="label" x="95" y="31">pointerTarget</text>
    <text class="small" x="95" y="54">정규화한 최신 터치 위치</text>
  </g>
  <path class="arrow" d="M532 176H584"/>
  <g transform="translate(594 138)">
    <rect class="box cpu" width="206" height="76" rx="15"/>
    <text class="label" x="103" y="31">dripEmitter</text>
    <text class="small" x="103" y="54">지수 완화로 source 추종</text>
  </g>
  <path class="arrow" d="M810 176H862"/>
  <g transform="translate(872 128)">
    <rect class="box cpu" width="250" height="96" rx="15"/>
    <text class="label" x="125" y="30">Particle Solver</text>
    <text class="small" x="125" y="53">최대 32개 위치 · 속도 · 질량 · 나이</text>
    <text class="small" x="125" y="74">중력 · 점성 · 응집력</text>
  </g>
  <path class="arrow" d="M1132 176H1184"/>
  <g transform="translate(1194 138)">
    <rect class="box cpu" width="136" height="76" rx="15"/>
    <text class="label" x="68" y="31">GPU uniforms</text>
    <text class="small" x="68" y="54">32개 packet</text>
  </g>

  <rect x="36" y="274" width="1328" height="470" rx="24" fill="#fff" stroke="#d9e1eb"/>
  <text class="lane" x="58" y="306">GPU · TEXT, GEOMETRY &amp; COLOR</text>

  <g transform="translate(70 338)">
    <rect class="box gpu" width="196" height="82" rx="15"/>
    <text class="label" x="98" y="30">Glyph atlases</text>
    <text class="small" x="98" y="53">글자 + 색 중심, 3×</text>
    <text class="channel" x="98" y="70">8 × 8 cells</text>
  </g>
  <g transform="translate(70 548)">
    <rect class="box state" width="196" height="82" rx="15"/>
    <text class="label" x="98" y="30">Glyph springs</text>
    <text class="small" x="98" y="53">offset · velocity</text>
    <text class="small" x="98" y="70">angle · angular velocity</text>
  </g>
  <path class="arrow" d="M276 379H328"/>
  <path class="arrow" d="M276 589H302V407H328"/>
  <g transform="translate(338 328)">
    <rect class="box gpu" width="218" height="102" rx="15"/>
    <text class="label" x="109" y="29">Deformed glyphs</text>
    <text class="small" x="109" y="52">글자별 이동·회전 적용</text>
    <text class="channel" x="109" y="72">text 1440 × 1800</text>
    <text class="channel" x="109" y="89">color centers 480 × 600</text>
  </g>
  <path class="arrow" d="M566 379H618"/>
  <path class="arrow" d="M1262 224V276H696V318"/>
  <g transform="translate(628 328)">
    <rect class="box geometry" width="240" height="102" rx="15"/>
    <text class="label" x="120" y="28">Interaction RGBA</text>
    <text class="channel" x="120" y="50">R active text pixel</text>
    <text class="channel" x="120" y="67">G current text mask</text>
    <text class="channel" x="120" y="84">B color center · A falloff</text>
  </g>

  <path class="arrow" d="M748 440V467H520V493"/>
  <g transform="translate(384 503)">
    <rect class="box geometry" width="272" height="90" rx="15"/>
    <text class="label" x="136" y="28">Metaball geometry</text>
    <text class="small" x="136" y="51">입력 threshold → 192 주변 표본</text>
    <text class="small" x="136" y="70">Gaussian H/V → surface field</text>
  </g>

  <path class="arrow" d="M868 365H908V493"/>
  <g transform="translate(774 503)">
    <rect class="box color" width="268" height="90" rx="15"/>
    <text class="label" x="134" y="28">Nearest glyph distance</text>
    <text class="small" x="134" y="51">글자 안 확산 8회 → seed</text>
    <text class="small" x="134" y="70">Jump Flood 6회</text>
  </g>

  <path class="arrow" d="M868 400H1098V493"/>
  <g transform="translate(1090 503)">
    <rect class="box color" width="232" height="90" rx="15"/>
    <text class="label" x="116" y="28">Color field</text>
    <text class="small" x="116" y="51">글자 + 타원 중심 혼합</text>
    <text class="small" x="116" y="70">Gaussian H/V</text>
  </g>

  <path class="arrow" d="M656 548H680V676H696"/>
  <path class="arrow" d="M447 430V462H320V618H831V625"/>
  <g transform="translate(706 635)">
    <rect class="box state" width="250" height="82" rx="15"/>
    <text class="label" x="125" y="30">Contact → spring update</text>
    <text class="small" x="125" y="53">9 × 9 접촉 표본</text>
    <text class="small" x="125" y="70">64 × 1 ping-pong target</text>
  </g>
  <path class="feedback" d="M706 700H316V618H276"/>
  <text class="small" x="480" y="727">다음 프레임에 글자 위치와 실루엣 입력을 함께 갱신</text>

  <path class="arrow" d="M520 603V746H1050V774"/>
  <path class="arrow" d="M1020 603V728H1125V774"/>
  <path class="arrow" d="M1206 603V774"/>

  <rect x="36" y="768" width="1328" height="102" rx="24" fill="#f8fafc" stroke="#d9e1eb"/>
  <text class="lane" x="58" y="800">OUTPUT &amp; DEBUG</text>
  <g transform="translate(1000 784)">
    <rect class="output" width="300" height="66" rx="16"/>
    <text class="output-label" x="150" y="28">FINAL compositing</text>
    <text class="output-small" x="150" y="49">text + silhouette + color + AA</text>
  </g>

  <g transform="translate(230 784)">
    <rect class="box gpu" width="270" height="66" rx="16"/>
    <text class="label" x="135" y="27">Process View</text>
    <text class="small" x="135" y="49">Solver · Contact · Contour</text>
  </g>
  <text class="small" x="710" y="812">CPU 상태와 중간 target을 읽기만 하며 계산은 계속 유지된다</text>
</svg>
