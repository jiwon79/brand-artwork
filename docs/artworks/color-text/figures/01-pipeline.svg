<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">액체 실루엣이 만들어지는 여섯 단계</title>
  <desc id="desc">이동하고 회전한 글자 마스크, 완화된 큰 터치 source와 낙하 입자, 활성 픽셀, 주변 표본 field, 매끄럽게 만들기, 접촉 스프링 계산과 다음 프레임 피드백의 순서도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; }
      .label { font: 700 20px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 400 16px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #5b6675; text-anchor: middle; }
      .box { fill: #f7f9fc; stroke: #c7cfda; stroke-width: 2; rx: 18; }
      .accent { fill: #e8f0ff; stroke: #4c78c2; stroke-width: 2; rx: 18; }
      .arrow { stroke: #5b6675; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#ffffff"/>
  <text class="title" x="54" y="52">한 장의 그림은 여섯 번의 계산을 거쳐 만들어진다</text>

  <g transform="translate(42 105)">
    <rect class="box" width="155" height="174"/>
    <path d="M52 40 L77 72 L102 40 M77 72 L77 108" transform="rotate(8 77 72) translate(0 4)" fill="none" stroke="#172033" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="77.5" y="132">현재 글자</text>
    <text class="small" x="77.5" y="158">하강 + 회전</text>
  </g>
  <path d="M205 176 H222 V168 L235 180 L222 192 V184 H205Z" fill="#5b6675"/>

  <g transform="translate(239 105)">
    <rect class="box" width="155" height="174"/>
    <ellipse cx="77.5" cy="37" rx="42" ry="19" fill="#dce6f6"/>
    <ellipse cx="77.5" cy="66" rx="32" ry="21" fill="#b9cae4" fill-opacity=".8"/>
    <ellipse cx="77.5" cy="94" rx="22" ry="17" fill="#4c78c2" fill-opacity=".55"/>
    <circle cx="77.5" cy="24" r="7" fill="#4c78c2"/>
    <text class="label" x="77.5" y="132">큰 source 이동</text>
    <text class="small" x="77.5" y="158">완화 추종 + 낙하</text>
  </g>
  <path d="M402 176 H419 V168 L432 180 L419 192 V184 H402Z" fill="#5b6675"/>

  <g transform="translate(436 105)">
    <rect class="box" width="155" height="174"/>
    <path d="M48 32 L77 67 L106 32 M77 67 L77 108" fill="none" stroke="#c7cfda" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="45" r="8" fill="#4c78c2"/>
    <circle cx="70" cy="60" r="8" fill="#4c78c2"/>
    <circle cx="82" cy="73" r="8" fill="#4c78c2"/>
    <circle cx="77" cy="91" r="8" fill="#4c78c2"/>
    <text class="label" x="77.5" y="132">활성 픽셀</text>
    <text class="small" x="77.5" y="158">마스크 × 흐름</text>
  </g>
  <path d="M599 176 H616 V168 L629 180 L616 192 V184 H599Z" fill="#5b6675"/>

  <g transform="translate(633 105)">
    <rect class="accent" width="155" height="174"/>
    <circle cx="55" cy="61" r="35" fill="#4c78c2" fill-opacity=".16" stroke="#4c78c2" stroke-opacity=".45"/>
    <circle cx="80" cy="55" r="35" fill="#4c78c2" fill-opacity=".16" stroke="#4c78c2" stroke-opacity=".45"/>
    <circle cx="104" cy="68" r="35" fill="#4c78c2" fill-opacity=".16" stroke="#4c78c2" stroke-opacity=".45"/>
    <text class="label" x="77.5" y="126">주변 픽셀 조사</text>
    <text class="small" x="77.5" y="154">192 probes</text>
  </g>
  <path d="M796 176 H813 V168 L826 180 L813 192 V184 H796Z" fill="#5b6675"/>

  <g transform="translate(830 105)">
    <rect class="box" width="155" height="174"/>
    <path d="M27 77 C30 35 58 30 80 44 C104 30 129 44 130 77 C130 101 105 108 79 102 C53 111 25 101 27 77Z" fill="#dce6f6" stroke="#4c78c2" stroke-width="2"/>
    <text class="label" x="77.5" y="132">매끄럽게</text>
    <text class="small" x="77.5" y="158">Smoothing</text>
  </g>
  <path d="M993 176 H1010 V168 L1023 180 L1010 192 V184 H993Z" fill="#5b6675"/>

  <g transform="translate(1027 105)">
    <rect class="accent" width="155" height="174"/>
    <path d="M27 77 C30 35 58 30 80 44 C104 30 129 44 130 77 C130 101 105 108 79 102 C53 111 25 101 27 77Z" fill="#172033"/>
    <text class="label" x="77.5" y="132">접촉 스프링</text>
    <text class="small" x="77.5" y="158">이동 + 회전 갱신</text>
  </g>

  <path d="M1105 292 C1105 338 120 338 120 292" fill="none" stroke="#4c78c2" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <rect x="418" y="306" width="388" height="30" rx="9" fill="#ffffff"/>
  <text class="small" x="612" y="327">다음 프레임의 글자 마스크를 다시 만든다</text>
</svg>
