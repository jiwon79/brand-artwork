<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">글자 획 위의 보이지 않는 구슬과 메타볼 장</title>
  <desc id="desc">왼쪽에는 Y 획 위에 겹친 영향력 원들이 있고 오른쪽에는 그 영향력을 합쳐 얻은 하나의 경계가 있다</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#5b6675"/>
    </marker>
    <radialGradient id="softBall">
      <stop offset="0" stop-color="#4c78c2" stop-opacity=".28"/>
      <stop offset=".65" stop-color="#4c78c2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4c78c2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 700 30px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; }
      .head { font: 700 23px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .body { font: 400 18px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #5b6675; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text class="title" x="56" y="58">구슬 하나를 그리는 것이 아니라, 겹친 영향력의 ‘높이’를 계산한다</text>

  <rect x="48" y="100" width="475" height="430" rx="24" fill="#f7f9fc" stroke="#c7cfda" stroke-width="2"/>
  <text class="head" x="285" y="145">1. 글자 획 위에 영향력 놓기</text>
  <path d="M188 218 L285 325 L382 218 M285 325 L285 458" fill="none" stroke="#172033" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <circle cx="195" cy="226" r="76" fill="url(#softBall)"/><circle cx="234" cy="270" r="76" fill="url(#softBall)"/>
    <circle cx="276" cy="315" r="76" fill="url(#softBall)"/><circle cx="324" cy="279" r="76" fill="url(#softBall)"/>
    <circle cx="372" cy="226" r="76" fill="url(#softBall)"/><circle cx="285" cy="365" r="76" fill="url(#softBall)"/>
    <circle cx="285" cy="430" r="76" fill="url(#softBall)"/>
  </g>
  <g fill="#4c78c2">
    <circle cx="195" cy="226" r="6"/><circle cx="234" cy="270" r="6"/><circle cx="276" cy="315" r="6"/>
    <circle cx="324" cy="279" r="6"/><circle cx="372" cy="226" r="6"/><circle cx="285" cy="365" r="6"/><circle cx="285" cy="430" r="6"/>
  </g>
  <text class="body" x="285" y="494">점에 가까울수록 영향력이 강하고,</text>
  <text class="body" x="285" y="518">멀수록 부드럽게 약해진다.</text>

  <path d="M545 310 H620 V298 L648 315 L620 332 V320 H545Z" fill="#5b6675"/>
  <text class="body" x="594" y="288">모두 더하기</text>

  <rect x="668" y="100" width="484" height="430" rx="24" fill="#f7f9fc" stroke="#c7cfda" stroke-width="2"/>
  <text class="head" x="910" y="145">2. 같은 높이를 이은 선 꺼내기</text>
  <path d="M778 230 C816 174 873 192 909 243 C947 192 1009 177 1042 232 C1063 267 1040 306 1003 323 C963 342 960 383 968 423 C978 467 936 489 905 462 C874 488 832 467 842 423 C850 382 849 343 811 323 C771 304 753 267 778 230Z" fill="#dce6f6" stroke="#4c78c2" stroke-width="4"/>
  <path d="M810 242 C838 210 871 223 897 260 C907 275 915 275 925 260 C951 223 987 210 1014 242" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
  <path d="M909 285 C890 326 889 360 905 389 C921 360 924 326 909 285Z" fill="#ffffff"/>
  <text class="body" x="910" y="494">기준 높이보다 높은 곳만 남기면</text>
  <text class="body" x="910" y="518">하나로 이어진 액체 경계가 된다.</text>
  <text class="body" x="600" y="584">원의 윤곽을 직접 그리지 않기 때문에, 결과가 ‘동그란 점들의 모음’처럼 보이지 않는다.</text>
</svg>
