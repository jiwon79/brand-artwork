<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">커서 이동과 시간 기억</title>
  <desc id="desc">커서가 오른쪽으로 이동한 뒤 이전 효과가 서서히 약해지다가 임계값 아래에서 사라지는 네 프레임</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#5b6675"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; }
      .label { font: 700 18px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 400 15px Arial, 'Apple SD Gothic Neo', sans-serif; fill: #5b6675; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="390" fill="#ffffff"/>
  <text class="title" x="52" y="52">화면은 현재 위치만 보지 않고, 바로 전 순간을 조금 기억한다</text>
  <g transform="translate(46 92)">
    <rect width="235" height="190" rx="20" fill="#f7f9fc" stroke="#c7cfda" stroke-width="2"/>
    <path d="M42 102 C45 55 88 54 119 78 C150 54 193 55 196 102 C198 137 162 149 119 141 C76 149 40 137 42 102Z" fill="#70809a"/>
    <circle cx="119" cy="95" r="8" fill="#172033"/>
    <text class="label" x="117.5" y="222">기존 위치</text>
    <text class="small" x="117.5" y="247">충분히 쌓임</text>
  </g>
  <path d="M289 182 H312 V172 L328 186 L312 200 V190 H289Z" fill="#5b6675"/>
  <g transform="translate(333 92)">
    <rect width="235" height="190" rx="20" fill="#f7f9fc" stroke="#c7cfda" stroke-width="2"/>
    <path d="M31 102 C34 55 77 54 108 78 C139 54 182 55 185 102 C187 137 151 149 108 141 C65 149 29 137 31 102Z" fill="#70809a" fill-opacity=".92"/>
    <circle cx="190" cy="95" r="8" fill="#172033"/>
    <text class="label" x="117.5" y="222">커서 이동 직후</text>
    <text class="small" x="117.5" y="247">이전 형태가 남아 있음</text>
  </g>
  <path d="M576 182 H599 V172 L615 186 L599 200 V190 H576Z" fill="#5b6675"/>
  <g transform="translate(620 92)">
    <rect width="235" height="190" rx="20" fill="#f7f9fc" stroke="#c7cfda" stroke-width="2"/>
    <path d="M29 104 C32 69 66 68 91 86 C116 68 150 69 153 104 C155 130 126 140 91 134 C56 140 27 130 29 104Z" fill="#70809a" fill-opacity=".38"/>
    <path d="M140 104 C143 75 171 73 191 88 C211 73 229 82 229 106 C229 129 210 136 186 131 C162 136 138 128 140 104Z" fill="#70809a" fill-opacity=".83"/>
    <circle cx="190" cy="95" r="8" fill="#172033"/>
    <text class="label" x="117.5" y="222">잠시 뒤</text>
    <text class="small" x="117.5" y="247">옛 형태는 약해지고 새 형태는 자람</text>
  </g>
  <path d="M863 182 H886 V172 L902 186 L886 200 V190 H863Z" fill="#5b6675"/>
  <g transform="translate(907 92)">
    <rect width="235" height="190" rx="20" fill="#f7f9fc" stroke="#4c78c2" stroke-width="2"/>
    <path d="M140 102 C143 55 186 54 217 78 C237 94 232 130 210 141 C186 151 138 138 140 102Z" fill="#70809a"/>
    <circle cx="190" cy="95" r="8" fill="#172033"/>
    <text class="label" x="117.5" y="222">임계값 아래</text>
    <text class="small" x="117.5" y="247">옛 형태가 한 번에 사라짐</text>
  </g>
  <text class="small" x="600" y="361">빠르게 생기고(55 ms), 더 천천히 사라지며(340 ms), 커서 자체도 속도 제한을 받는다.</text>
</svg>
