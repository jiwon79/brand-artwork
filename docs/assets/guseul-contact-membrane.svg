<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Contact membrane link ordering</title>
  <desc id="description">A comparison between connecting contacts in input order, which crosses links, and connecting contacts in polar angle order around the center seed.</desc>
  <defs>
    <marker id="angleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2878d0"/>
    </marker>
    <style>
      .title { font: 700 32px ui-sans-serif, system-ui, sans-serif; fill: #152238; }
      .label { font: 600 19px ui-sans-serif, system-ui, sans-serif; fill: #34445e; }
      .small { font: 500 16px ui-sans-serif, system-ui, sans-serif; fill: #657087; }
      .contact { fill: #66d9e8; stroke: #17365d; stroke-width: 4; }
      .seed { fill: #eef2f7; stroke: #53627a; stroke-width: 4; }
      .bridge { stroke: #9ca8b9; stroke-width: 16; stroke-linecap: round; opacity: 0.38; }
      .wrong { fill: none; stroke: #e5484d; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .right { fill: #66d9e8; fill-opacity: 0.16; stroke: #2878d0; stroke-width: 7; stroke-linejoin: round; }
      .number { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #152238; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <line x1="640" y1="40" x2="640" y2="680" stroke="#d9dee6" stroke-width="2"/>

  <text class="title" x="320" y="70" text-anchor="middle">입력 순서로 연결</text>
  <text class="small" x="320" y="102" text-anchor="middle">pointer ID나 생성 순서는 공간적 이웃을 뜻하지 않는다</text>

  <line class="bridge" x1="320" y1="360" x2="320" y2="155"/>
  <line class="bridge" x1="320" y1="360" x2="525" y2="360"/>
  <line class="bridge" x1="320" y1="360" x2="320" y2="565"/>
  <line class="bridge" x1="320" y1="360" x2="115" y2="360"/>
  <path class="wrong" d="M 320 155 L 320 565 L 525 360 L 115 360 Z"/>
  <circle class="seed" cx="320" cy="360" r="67"/>
  <circle class="contact" cx="320" cy="155" r="48"/><text class="number" x="320" y="155">1</text>
  <circle class="contact" cx="320" cy="565" r="48"/><text class="number" x="320" y="565">2</text>
  <circle class="contact" cx="525" cy="360" r="48"/><text class="number" x="525" y="360">3</text>
  <circle class="contact" cx="115" cy="360" r="48"/><text class="number" x="115" y="360">4</text>
  <circle cx="320" cy="360" r="8" fill="#53627a"/>
  <text class="label" x="320" y="656" text-anchor="middle" fill="#c93439">연결선이 중심에서 교차하고 membrane이 뒤집힘</text>

  <text class="title" x="960" y="70" text-anchor="middle">중심 각도순으로 연결</text>
  <text class="small" x="960" y="102" text-anchor="middle">atan2(y, x)로 정렬한 뒤 현재 contact와 다음 contact를 연결</text>

  <line class="bridge" x1="960" y1="360" x2="960" y2="155"/>
  <line class="bridge" x1="960" y1="360" x2="1165" y2="360"/>
  <line class="bridge" x1="960" y1="360" x2="960" y2="565"/>
  <line class="bridge" x1="960" y1="360" x2="755" y2="360"/>
  <path class="right" d="M 960 155 L 1165 360 L 960 565 L 755 360 Z"/>
  <circle class="seed" cx="960" cy="360" r="67"/>
  <circle class="contact" cx="960" cy="155" r="48"/><text class="number" x="960" y="155">1</text>
  <circle class="contact" cx="1165" cy="360" r="48"/><text class="number" x="1165" y="360">2</text>
  <circle class="contact" cx="960" cy="565" r="48"/><text class="number" x="960" y="565">3</text>
  <circle class="contact" cx="755" cy="360" r="48"/><text class="number" x="755" y="360">4</text>
  <circle cx="960" cy="360" r="8" fill="#53627a"/>
  <path d="M 860 197 A 190 190 0 0 1 1123 235" fill="none" stroke="#2878d0" stroke-width="4" marker-end="url(#angleArrow)"/>
  <text class="label" x="960" y="656" text-anchor="middle" fill="#2267b2">외곽 이웃을 순환 연결해 닫힌 membrane을 만듦</text>
</svg>
