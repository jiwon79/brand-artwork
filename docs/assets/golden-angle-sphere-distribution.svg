<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Golden-angle rotation and Fibonacci sphere distribution</title>
  <desc id="desc">The left panel shows eight successive directions separated by 137.5 degrees. The right panel shows thirty-two points distributed at equal y intervals over a sphere, with front points filled and back points outlined.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#148a8a"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef694f"/>
    </marker>
    <style>
      .title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182326; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #35464a; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #607175; }
      .guide { fill: none; stroke: #cbd5d7; stroke-width: 1.5; stroke-dasharray: 5 6; }
      .spoke { stroke: #148a8a; stroke-width: 2; opacity: 0.66; marker-end: url(#arrow); }
      .front { fill: #ef694f; stroke: #fff; stroke-width: 2; }
      .back { fill: #fff; stroke: #148a8a; stroke-width: 2; opacity: 0.68; }
      .index { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182326; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="960" height="480" fill="#ffffff"/>
  <line x1="480" y1="46" x2="480" y2="434" stroke="#e4e9ea" stroke-width="2"/>

  <text x="235" y="42" class="title" text-anchor="middle">Golden-angle step</text>
  <text x="235" y="66" class="small" text-anchor="middle">Each point rotates by 137.5 degrees</text>
  <circle cx="235" cy="240" r="150" fill="#f8fbfb" stroke="#b9c7ca" stroke-width="2"/>
  <circle cx="235" cy="240" r="4" fill="#182326"/>

  <line x1="235" y1="240" x2="235" y2="115" class="spoke"/>
  <line x1="235" y1="240" x2="319.4" y2="332.2" class="spoke"/>
  <line x1="235" y1="240" x2="110.5" y2="229.1" class="spoke"/>
  <line x1="235" y1="240" x2="334.2" y2="163.9" class="spoke"/>
  <line x1="235" y1="240" x2="213.2" y2="363.1" class="spoke"/>
  <line x1="235" y1="240" x2="167.9" y2="134.5" class="spoke"/>
  <line x1="235" y1="240" x2="355.7" y2="272.5" class="spoke"/>
  <line x1="235" y1="240" x2="124.1" y2="297.6" class="spoke"/>

  <path d="M 235 178 A 62 62 0 0 1 276.9 285.7" fill="none" stroke="#ef694f" stroke-width="4" marker-end="url(#arrow-coral)"/>
  <text x="302" y="235" class="label" fill="#ef694f">137.5 degrees</text>

  <circle cx="235" cy="115" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="235" y="115" class="index">0</text>
  <circle cx="319.4" cy="332.2" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="319.4" y="332.2" class="index">1</text>
  <circle cx="110.5" cy="229.1" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="110.5" y="229.1" class="index">2</text>
  <circle cx="334.2" cy="163.9" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="334.2" y="163.9" class="index">3</text>
  <circle cx="213.2" cy="363.1" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="213.2" y="363.1" class="index">4</text>
  <circle cx="167.9" cy="134.5" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="167.9" y="134.5" class="index">5</text>
  <circle cx="355.7" cy="272.5" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="355.7" y="272.5" class="index">6</text>
  <circle cx="124.1" cy="297.6" r="12" fill="#fff" stroke="#ef694f" stroke-width="2"/><text x="124.1" y="297.6" class="index">7</text>

  <text x="720" y="42" class="title" text-anchor="middle">Equal-area sphere points</text>
  <text x="720" y="66" class="small" text-anchor="middle">Equal y bands + golden-angle longitude</text>
  <circle cx="720" cy="240" r="165" fill="#f8fbfb" stroke="#718488" stroke-width="2.5"/>
  <line x1="592.8" y1="135" x2="847.2" y2="135" class="guide"/>
  <line x1="570.6" y1="170" x2="869.4" y2="170" class="guide"/>
  <line x1="558.8" y1="205" x2="881.2" y2="205" class="guide"/>
  <line x1="555" y1="240" x2="885" y2="240" class="guide"/>
  <line x1="558.8" y1="275" x2="881.2" y2="275" class="guide"/>
  <line x1="570.6" y1="310" x2="869.4" y2="310" class="guide"/>
  <line x1="592.8" y1="345" x2="847.2" y2="345" class="guide"/>

  <circle cx="756.0" cy="99.5" r="6" class="front"/>
  <circle cx="674.8" cy="108.6" r="6" class="front"/>
  <circle cx="726.8" cy="117.7" r="6" class="back"/>
  <circle cx="775.1" cy="126.7" r="6" class="front"/>
  <circle cx="620.7" cy="135.8" r="6" class="back"/>
  <circle cx="812.3" cy="144.8" r="6" class="back"/>
  <circle cx="689.7" cy="153.9" r="6" class="front"/>
  <circle cx="663.4" cy="163.0" r="6" class="back"/>
  <circle cx="840.3" cy="172.0" r="6" class="front"/>
  <circle cx="597.5" cy="181.1" r="6" class="front"/>
  <circle cx="777.7" cy="190.2" r="6" class="back"/>
  <circle cx="761.6" cy="199.2" r="6" class="front"/>
  <circle cx="597.6" cy="208.3" r="6" class="back"/>
  <circle cx="859.9" cy="217.3" r="6" class="back"/>
  <circle cx="637.0" cy="226.4" r="6" class="front"/>
  <circle cx="701.4" cy="235.5" r="6" class="back"/>
  <circle cx="830.8" cy="244.5" r="6" class="front"/>
  <circle cx="575.8" cy="253.6" r="6" class="front"/>
  <circle cx="821.5" cy="262.7" r="6" class="back"/>
  <circle cx="713.5" cy="271.7" r="6" class="front"/>
  <circle cx="630.8" cy="280.8" r="6" class="back"/>
  <circle cx="854.9" cy="289.8" r="6" class="front"/>
  <circle cx="611.2" cy="298.9" r="6" class="front"/>
  <circle cx="748.1" cy="308.0" r="6" class="back"/>
  <circle cx="781.1" cy="317.0" r="6" class="front"/>
  <circle cx="608.8" cy="326.1" r="6" class="back"/>
  <circle cx="819.3" cy="335.2" r="6" class="back"/>
  <circle cx="681.1" cy="344.2" r="6" class="front"/>
  <circle cx="689.4" cy="353.3" r="6" class="back"/>
  <circle cx="788.9" cy="362.3" r="6" class="front"/>
  <circle cx="660.7" cy="371.4" r="6" class="front"/>
  <circle cx="739.5" cy="380.5" r="6" class="back"/>

  <circle cx="629" cy="426" r="6" class="front"/>
  <text x="642" y="431" class="small">front</text>
  <circle cx="724" cy="426" r="6" class="back"/>
  <text x="737" y="431" class="small">back</text>
  <line x1="810" y1="426" x2="838" y2="426" class="guide"/>
  <text x="846" y="431" class="small">equal y</text>
</svg>
