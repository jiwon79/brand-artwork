<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Hard minimum and smooth minimum SDF union</title>
  <desc id="description">A side-by-side comparison of a sharp circle-to-bridge union and a rounded smooth minimum union, including distance graphs and surface normals.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#163b73"/>
    </marker>
    <marker id="goldArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#e5a700"/>
    </marker>
    <linearGradient id="blendBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd76a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </linearGradient>
    <path id="hardShape" d="M 425 213 L 670 213 A 60 60 0 0 1 730 273 A 60 60 0 0 1 670 333 L 425 333 A 145 145 0 1 1 425 213 Z"/>
    <path id="smoothShape" d="M 1125 213 C 1144 253 1175 230 1210 230 L 1360 230 A 43 43 0 0 1 1403 273 A 43 43 0 0 1 1360 316 L 1210 316 C 1175 316 1144 293 1125 333 A 145 145 0 1 1 1125 213 Z"/>
    <style>
      .title { font: 700 34px ui-sans-serif, system-ui, sans-serif; fill: #152238; }
      .label { font: 600 20px ui-sans-serif, system-ui, sans-serif; fill: #34445e; }
      .small { font: 500 17px ui-sans-serif, system-ui, sans-serif; fill: #526079; }
      .formula { font: 600 21px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #152238; }
      .shape { fill: #66d9e8; stroke: #152238; stroke-width: 4; vector-effect: non-scaling-stroke; }
      .contour { fill: none; stroke: #b4bfcd; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .normal { stroke: #163b73; stroke-width: 4; marker-end: url(#arrow); }
      .axis { stroke: #7d899b; stroke-width: 2; }
      .guide { stroke: #ccd3dd; stroke-width: 1.5; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>
  <line x1="720" y1="38" x2="720" y2="862" stroke="#d9dee6" stroke-width="2"/>

  <text class="title" x="360" y="65" text-anchor="middle">min(a, b)</text>
  <text class="title" x="1080" y="65" text-anchor="middle">smoothMinimum(a, b, k)</text>

  <use href="#hardShape" class="contour" transform="translate(-45 -27.3) scale(1.1)"/>
  <use href="#hardShape" class="contour" transform="translate(-90 -54.6) scale(1.2)" opacity="0.7"/>
  <use href="#hardShape" class="shape"/>
  <circle cx="425" cy="213" r="7" fill="#e5484d"/>
  <circle cx="425" cy="333" r="7" fill="#e5484d"/>
  <path d="M 445 190 L 470 150" class="normal"/>
  <path d="M 455 215 L 500 180" class="normal"/>
  <path d="M 455 331 L 500 366" class="normal"/>
  <path d="M 445 355 L 470 395" class="normal"/>
  <text x="455" y="410" class="label" fill="#c93439">normal이 즉시 전환</text>

  <use href="#smoothShape" class="contour" transform="translate(-115 -27.3) scale(1.1)"/>
  <use href="#smoothShape" class="contour" transform="translate(-230 -54.6) scale(1.2)" opacity="0.7"/>
  <use href="#smoothShape" class="shape"/>
  <rect x="1110" y="165" width="145" height="216" rx="70" fill="url(#blendBand)" stroke="#e5a700" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M 1138 196 L 1160 154" class="normal"/>
  <path d="M 1162 213 L 1195 176" class="normal"/>
  <path d="M 1192 228 L 1235 198" class="normal"/>
  <path d="M 1192 318 L 1235 348" class="normal"/>
  <path d="M 1162 333 L 1195 370" class="normal"/>
  <path d="M 1138 350 L 1160 392" class="normal"/>
  <line x1="1110" y1="410" x2="1255" y2="410" stroke="#e5a700" stroke-width="3" marker-start="url(#goldArrow)" marker-end="url(#goldArrow)"/>
  <text x="1182" y="442" class="label" text-anchor="middle" fill="#b57d00">blend radius k</text>

  <text class="label" x="90" y="505">거리 함수 단면</text>
  <line class="axis" x1="110" y1="720" x2="620" y2="720"/>
  <line class="axis" x1="365" y1="540" x2="365" y2="770"/>
  <line class="guide" x1="110" y1="650" x2="620" y2="650"/>
  <polyline points="130,760 365,600 600,440" fill="none" stroke="#2878d0" stroke-width="4"/>
  <polyline points="130,440 365,600 600,760" fill="none" stroke="#2b8a3e" stroke-width="4"/>
  <polyline points="130,760 365,600 600,760" fill="none" stroke="#e5484d" stroke-width="6"/>
  <text class="formula" x="605" y="458" fill="#2878d0">a(x)</text>
  <text class="formula" x="605" y="748" fill="#2b8a3e">b(x)</text>
  <text class="formula" x="365" y="805" text-anchor="middle" fill="#c93439">min(a, b): 기울기에 모서리가 생김</text>

  <text class="label" x="810" y="505">거리 함수 단면</text>
  <line class="axis" x1="830" y1="720" x2="1340" y2="720"/>
  <line class="axis" x1="1085" y1="540" x2="1085" y2="770"/>
  <line class="guide" x1="830" y1="650" x2="1340" y2="650"/>
  <polyline points="850,760 1085,600 1320,440" fill="none" stroke="#2878d0" stroke-width="4"/>
  <polyline points="850,440 1085,600 1320,760" fill="none" stroke="#2b8a3e" stroke-width="4"/>
  <path d="M 850 760 L 1000 658 C 1040 630 1058 625 1085 625 C 1112 625 1130 630 1170 658 L 1320 760" fill="none" stroke="#e5484d" stroke-width="6"/>
  <text class="formula" x="1325" y="458" fill="#2878d0">a(x)</text>
  <text class="formula" x="1325" y="748" fill="#2b8a3e">b(x)</text>
  <text class="formula" x="1085" y="805" text-anchor="middle" fill="#c93439">smooth min: 기울기도 연속적으로 전환</text>

  <text class="small" x="720" y="865" text-anchor="middle">distance &lt; 0: 내부   |   distance = 0: 외곽선   |   distance &gt; 0: 외부</text>
</svg>
