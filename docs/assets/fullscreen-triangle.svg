<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">A fullscreen triangle covering the WebGL viewport</title>
  <desc id="desc">An oversized triangle with clip-space vertices minus one minus one, three minus one, and minus one three covers the visible minus one to one viewport square. Geometry outside the viewport is clipped.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#53666a"/>
    </marker>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162326; }
      .heading { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26373a; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #405256; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #68797c; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#fff"/>
  <text x="480" y="38" class="title" text-anchor="middle">One oversized triangle runs the fragment shader across the viewport</text>

  <rect x="45" y="70" width="520" height="370" rx="8" fill="#f8fbfb" stroke="#d8e0e2" stroke-width="2"/>
  <text x="315" y="100" class="heading">Clip-space geometry</text>

  <path d="M90 405 L390 405 L90 105 Z" fill="#dce7fb" stroke="#5578bd" stroke-width="3"/>
  <text x="120" y="175" class="small">triangle area outside the viewport</text>

  <rect x="90" y="255" width="150" height="150" fill="#d8f1ee" fill-opacity="0.92" stroke="#168c88" stroke-width="4"/>
  <text x="165" y="322" class="heading" text-anchor="middle">visible viewport</text>
  <text x="165" y="345" class="small" text-anchor="middle">clip range -1 to 1</text>

  <circle cx="90" cy="405" r="6" fill="#ef6752"/>
  <circle cx="390" cy="405" r="6" fill="#ef6752"/>
  <circle cx="90" cy="105" r="6" fill="#ef6752"/>
  <text x="105" y="425" class="label">A (-1, -1)</text>
  <text x="310" y="425" class="label">B (3, -1)</text>
  <text x="105" y="124" class="label">C (-1, 3)</text>

  <path d="M260 300 H355" fill="none" stroke="#53666a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="307" y="285" class="small" text-anchor="middle">outside is clipped</text>

  <rect x="600" y="70" width="315" height="370" rx="8" fill="#fff9f5" stroke="#eaded7" stroke-width="2"/>
  <text x="620" y="100" class="heading">Why not a rectangle?</text>

  <rect x="650" y="130" width="110" height="110" fill="#fff" stroke="#8b9a9d" stroke-width="2"/>
  <line x1="650" y1="240" x2="760" y2="130" stroke="#ef8d42" stroke-width="2"/>
  <text x="780" y="176" class="label">rectangle</text>
  <text x="780" y="197" class="small">2 triangles</text>
  <text x="780" y="216" class="small">shared diagonal</text>

  <path d="M650 368 L778 368 L650 240 Z" fill="#dce7fb" stroke="#5578bd" stroke-width="3"/>
  <rect x="650" y="304" width="64" height="64" fill="#d8f1ee" fill-opacity="0.92" stroke="#168c88" stroke-width="3"/>
  <text x="790" y="311" class="label">fullscreen triangle</text>
  <text x="790" y="332" class="small">1 triangle</text>
  <text x="790" y="351" class="small">no shared edge</text>

  <rect x="110" y="462" width="740" height="42" rx="7" fill="#18282b"/>
  <text x="480" y="488" class="code" fill="#fff" text-anchor="middle">(-1, -1)   (3, -1)   (-1, 3)  -> viewport [-1, 1] is fully covered</text>
</svg>
