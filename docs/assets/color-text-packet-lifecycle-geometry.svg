<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="280" viewBox="0 0 1140 280" role="img" aria-labelledby="title desc">
  <title id="title">터치 source와 물 packet의 생명주기 도형</title>
  <desc id="desc">누르고 있을 때 source 아래에서 커지는 물, 드래그할 때 이전 위치에 남아 흐르는 물과 새 source, 손을 뗀 뒤 공급이 멈추고 아래로 빠지는 물을 보여준다.</desc>
  <defs>
    <radialGradient id="packet" cx="48%" cy="35%" r="66%">
      <stop offset="0" stop-color="#e36fb0" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#829fd4" stop-opacity=".7"/>
      <stop offset="1" stop-color="#b8d8f2" stop-opacity=".18"/>
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g transform="translate(25 4)">
    <circle cx="150" cy="35" r="27" fill="#fff" stroke="#172033" stroke-width="2.5"/>
    <circle cx="150" cy="35" r="5" fill="#172033"/>
    <ellipse cx="150" cy="154" rx="64" ry="92" fill="#9fc5e5" fill-opacity=".22" filter="url(#soft)"/>
    <ellipse cx="150" cy="154" rx="42" ry="67" fill="url(#packet)"/>
    <ellipse cx="150" cy="154" rx="67" ry="97" fill="none" stroke="#4c78c2" stroke-opacity=".28" stroke-width="2"/>
  </g>

  <g transform="translate(407 0)">
    <path d="M28 43C81 6 155 25 260 54" fill="none" stroke="#4c78c2" stroke-width="3" stroke-dasharray="8 7"/>
    <circle cx="28" cy="43" r="19" fill="#fff" stroke="#98a6b9" stroke-width="2"/>
    <circle cx="260" cy="54" r="27" fill="#fff" stroke="#172033" stroke-width="2.5"/>
    <circle cx="260" cy="54" r="5" fill="#172033"/>
    <ellipse cx="44" cy="137" rx="46" ry="63" fill="url(#packet)"/>
    <ellipse cx="66" cy="229" rx="35" ry="62" fill="url(#packet)" opacity=".82"/>
    <ellipse cx="256" cy="151" rx="47" ry="65" fill="url(#packet)"/>
  </g>

  <g transform="translate(815 0)">
    <circle cx="150" cy="35" r="27" fill="#fff" stroke="#98a6b9" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M131 16 169 54M169 16 131 54" stroke="#d45992" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="150" cy="113" rx="50" ry="58" fill="url(#packet)"/>
    <ellipse cx="139" cy="211" rx="38" ry="67" fill="url(#packet)" opacity=".82"/>
    <line x1="42" y1="272" x2="258" y2="272" stroke="#66758a" stroke-width="2" stroke-dasharray="8 7"/>
  </g>
</svg>
