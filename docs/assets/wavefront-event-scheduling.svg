<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Synchronizing a visible eased wavefront with per-point events</title>
  <desc id="desc">Three panels show an eased radius over time, points at different normalized distances from the origin, and inverse easing that converts each distance back into the exact event time when the wave reaches it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71809c"/></marker>
    <style>
      .bg{fill:#0b0d12}.panel{fill:#151922;stroke:#374158;stroke-width:1.5}.step{fill:#7dd3fc;font:700 13px ui-monospace,monospace;letter-spacing:1px}.head{fill:#f5f7fb;font:700 19px system-ui,sans-serif}.body{fill:#b9c2d3;font:13px system-ui,sans-serif}.code{fill:#94a4c2;font:12px ui-monospace,monospace}.axis{stroke:#6c7890;stroke-width:1.5}.curve{fill:none;stroke:#67e8f9;stroke-width:3}.guide{stroke:#536078;stroke-width:1.2;stroke-dasharray:4 5}.ring{fill:none;stroke:#8bdcf7;stroke-width:13;opacity:.32}.flow{fill:none;stroke:#71809c;stroke-width:2;marker-end:url(#arrow)}.a{fill:#f472b6}.b{fill:#a78bfa}.c{fill:#fbbf24}.white{fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1120" height="430"/>
  <g transform="translate(24 24)">
    <rect class="panel" width="330" height="382" rx="16"/>
    <text class="step" x="20" y="32">01 FORWARD EASING</text><text class="head" x="20" y="64">Draw radius from time</text>
    <line class="axis" x1="48" y1="284" x2="282" y2="284"/><line class="axis" x1="48" y1="284" x2="48" y2="100"/>
    <path class="curve" d="M48 284 C90 195 153 133 282 105"/>
    <line class="guide" x1="48" y1="105" x2="282" y2="105"/><line class="guide" x1="282" y1="105" x2="282" y2="284"/>
    <text class="code" x="42" y="305">0</text><text class="code" x="269" y="305">time 1</text><text class="code" x="55" y="96">radius 1</text>
    <text class="body" x="20" y="340">매 frame의 progress가 화면 반지름을 만든다.</text><text class="code" x="20" y="364">radius = ease(time) × extent</text>
  </g>
  <path class="flow" d="M362 215 H386"/>
  <g transform="translate(394 24)">
    <rect class="panel" width="330" height="382" rx="16"/>
    <text class="step" x="20" y="32">02 SPATIAL DISTANCE</text><text class="head" x="20" y="64">Measure each event point</text>
    <circle class="ring" cx="158" cy="187" r="82"/><circle class="white" cx="158" cy="187" r="6"/>
    <line class="guide" x1="158" y1="187" x2="205" y2="156"/><line class="guide" x1="158" y1="187" x2="102" y2="121"/><line class="guide" x1="158" y1="187" x2="252" y2="228"/>
    <circle class="a" cx="205" cy="156" r="7"/><circle class="b" cx="102" cy="121" r="7"/><circle class="c" cx="252" cy="228" r="7"/>
    <text class="code" x="211" y="151">dA</text><text class="code" x="78" y="113">dB</text><text class="code" x="259" y="229">dC</text>
    <text class="body" x="20" y="340">점마다 중심 거리 d를 extent로 정규화한다.</text><text class="code" x="20" y="364">distanceProgress = d / extent</text>
  </g>
  <path class="flow" d="M732 215 H756"/>
  <g transform="translate(764 24)">
    <rect class="panel" width="332" height="382" rx="16"/>
    <text class="step" x="20" y="32">03 INVERSE SCHEDULING</text><text class="head" x="20" y="64">Recover arrival time</text>
    <line class="axis" x1="46" y1="251" x2="286" y2="251"/>
    <line class="guide" x1="93" y1="132" x2="93" y2="251"/><line class="guide" x1="166" y1="132" x2="166" y2="251"/><line class="guide" x1="250" y1="132" x2="250" y2="251"/>
    <circle class="a" cx="93" cy="203" r="7"/><circle class="b" cx="166" cy="167" r="7"/><circle class="c" cx="250" cy="139" r="7"/>
    <text class="code" x="75" y="276">tA</text><text class="code" x="148" y="276">tB</text><text class="code" x="232" y="276">tC</text>
    <path class="curve" d="M46 235 C95 198 167 160 286 132"/>
    <text class="body" x="20" y="316">같은 ease의 역함수로 도착 시간을 구하면</text><text class="body" x="20" y="337">보이는 crest와 event가 같은 위치에서 만난다.</text><text class="code" x="20" y="364">eventTime = inverseEase(d/extent)</text>
  </g>
</svg>
