  <title id="title">Y 교차부의 볼록한 경계와 오목한 경계</title>
  <desc id="desc">왼쪽은 가장 가까운 활성 픽셀 하나를 중심으로 만든 둥글고 볼록한 경계, 오른쪽은 주변 픽셀을 함께 누적해 두 팔 사이의 흰 공간이 줄기를 따라 내려오는 경계를 보여준다.</desc>

