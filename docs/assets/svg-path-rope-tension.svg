<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">SVG path samples become a graph-propagated rope tension field</title>
  <desc id="desc">Three panels show separate SVG contours sampled into points, invisible virtual joints joining their graph, and exponentially decreasing tension measured along the graph from an anchor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71809c"/></marker>
    <style>
      .bg{fill:#0b0d12}.panel{fill:#151922;stroke:#374158;stroke-width:1.5}.step{fill:#7dd3fc;font:700 13px ui-monospace,monospace;letter-spacing:1px}.head{fill:#f5f7fb;font:700 19px system-ui,sans-serif}.body{fill:#b9c2d3;font:13px system-ui,sans-serif}.code{fill:#94a4c2;font:12px ui-monospace,monospace}.path{fill:none;stroke:#67e8f9;stroke-width:3;stroke-linecap:round}.edge{fill:none;stroke:#72809b;stroke-width:1.5}.joint{fill:none;stroke:#fbbf24;stroke-width:2;stroke-dasharray:5 5}.flow{fill:none;stroke:#71809c;stroke-width:2;marker-end:url(#arrow)}.sample{fill:#0b0d12;stroke:#67e8f9;stroke-width:2}.anchor{fill:#fff;stroke:#f472b6;stroke-width:3}.near{fill:#f472b6}.mid{fill:#a78bfa}.far{fill:#4b5870}
    </style>
  </defs>
  <rect class="bg" width="1120" height="440"/>
  <g transform="translate(24 28)">
    <rect class="panel" width="330" height="384" rx="16"/>
    <text class="step" x="20" y="32">01 SAMPLE CONTOURS</text><text class="head" x="20" y="64">Keep visible gaps</text>
    <path class="path" d="M45 150 C72 95 122 98 145 151 S210 205 240 145"/>
    <path class="path" d="M93 214 C68 250 82 292 122 305"/>
    <path class="path" d="M206 216 C242 251 246 290 218 311"/>
    <g class="sample">
      <circle cx="47" cy="146" r="5"/><circle cx="78" cy="112" r="5"/><circle cx="116" cy="116" r="5"/><circle cx="145" cy="151" r="5"/><circle cx="181" cy="184" r="5"/><circle cx="219" cy="171" r="5"/><circle cx="240" cy="145" r="5"/>
      <circle cx="93" cy="214" r="5"/><circle cx="78" cy="251" r="5"/><circle cx="91" cy="286" r="5"/><circle cx="122" cy="305" r="5"/>
      <circle cx="206" cy="216" r="5"/><circle cx="234" cy="251" r="5"/><circle cx="238" cy="286" r="5"/><circle cx="218" cy="311" r="5"/>
    </g>
    <text class="body" x="20" y="345">각 M-start contour는 따로 표본화한다.</text><text class="code" x="20" y="368">startsPath · pathIndex · tangent</text>
  </g>
  <path class="flow" d="M362 220 H386"/>
  <g transform="translate(394 28)">
    <rect class="panel" width="330" height="384" rx="16"/>
    <text class="step" x="20" y="32">02 BUILD TENSION GRAPH</text><text class="head" x="20" y="64">Add invisible joints</text>
    <path class="edge" d="M45 150 L78 112 L116 116 L145 151 L181 184 L219 171 L240 145"/>
    <path class="edge" d="M93 214 L78 251 L91 286 L122 305"/><path class="edge" d="M206 216 L234 251 L238 286 L218 311"/>
    <path class="joint" d="M93 214 L145 151"/><path class="joint" d="M206 216 L181 184"/>
    <g class="sample">
      <circle cx="45" cy="150" r="5"/><circle cx="78" cy="112" r="5"/><circle cx="116" cy="116" r="5"/><circle cx="145" cy="151" r="5"/><circle cx="181" cy="184" r="5"/><circle cx="219" cy="171" r="5"/><circle cx="240" cy="145" r="5"/>
      <circle cx="93" cy="214" r="5"/><circle cx="78" cy="251" r="5"/><circle cx="91" cy="286" r="5"/><circle cx="122" cy="305" r="5"/><circle cx="206" cy="216" r="5"/><circle cx="234" cy="251" r="5"/><circle cx="238" cy="286" r="5"/><circle cx="218" cy="311" r="5"/>
    </g>
    <text class="body" x="20" y="345">노란 joint는 거리 전달에만 쓰고 그리지 않는다.</text><text class="code" x="20" y="368">LineGraphEdge[][] adjacency</text>
  </g>
  <path class="flow" d="M732 220 H756"/>
  <g transform="translate(764 28)">
    <rect class="panel" width="332" height="384" rx="16"/>
    <text class="step" x="20" y="32">03 PROPAGATE TENSION</text><text class="head" x="20" y="64">Distance, not point order</text>
    <path class="edge" d="M50 151 L88 119 L128 130 L163 166 L202 194 L243 184 L276 151"/>
    <path class="edge" d="M112 226 L93 260 L108 296 L143 314"/><path class="joint" d="M112 226 L163 166"/>
    <circle class="anchor" cx="163" cy="166" r="9"/>
    <circle class="near" cx="128" cy="130" r="7"/><circle class="near" cx="202" cy="194" r="7"/>
    <circle class="mid" cx="88" cy="119" r="6"/><circle class="mid" cx="112" cy="226" r="6"/>
    <circle class="far" cx="50" cy="151" r="5"/><circle class="far" cx="93" cy="260" r="5"/><circle class="far" cx="108" cy="296" r="5"/><circle class="far" cx="143" cy="314" r="5"/>
    <path class="flow" d="M164 167 C145 156 140 145 133 134"/><path class="flow" d="M160 174 C143 190 130 207 117 221"/>
    <text class="body" x="20" y="345">anchor에서 먼 sample일수록 영향이 줄어든다.</text><text class="code" x="20" y="368">exp(-graphDistance / reach)</text>
  </g>
</svg>
