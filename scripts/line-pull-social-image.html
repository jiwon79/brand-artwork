<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Pull 공유 이미지 합성</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #161616; color: #f4f2ec; font-family: system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { color: #c5c2bc; line-height: 1.6; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid #353535; }
    button { border: 0; border-radius: 6px; padding: 12px 20px; background: #f4f2ec; color: #111; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Line Pull 공유 이미지 합성</h1>
    <p>실제 PNG 캡처에 작품명과 4일차 표기를 합성합니다. 생성형 이미지나 JPEG 중간 파일은 사용하지 않습니다.</p>
    <canvas id="preview" width="1200" height="630" role="img" aria-label="Line Pull 작품명과 4일차 표기가 있는 공유 이미지"></canvas>
    <p id="status" role="status">원본 이미지와 Pretendard를 불러오는 중…</p>
    <button id="download" disabled>PNG 다운로드</button>
    <p>입력: <code>pages/line-pull/assets/og-artwork.png</code><br>
      저장 위치: <code>pages/line-pull/assets/og-image.png</code></p>
  </main>
  <script type="module">
    import { drawSocialImage, socialImage } from './line-pull-social-image.mjs';
    const canvas = document.querySelector('#preview');
    const status = document.querySelector('#status');
    const download = document.querySelector('#download');
    try {
      const font = new FontFace('Pretendard', 'url(/pages/line-pull/assets/Pretendard-ExtraBold.subset.woff2)', { weight: '800' });
      const source = new Image();
      source.src = '/pages/line-pull/assets/og-artwork.png';
      const [loadedFont] = await Promise.all([font.load(), source.decode()]);
      document.fonts.add(loadedFont);
      drawSocialImage(canvas.getContext('2d'), source);
      status.textContent = `${socialImage.width} × ${socialImage.height} PNG 준비 완료 · ${socialImage.title} · ${socialImage.series}`;
      download.disabled = false;
      download.addEventListener('click', () => {
        canvas.toBlob(blob => {
          if (!blob) { status.textContent = 'PNG 저장에 실패했습니다.'; return; }
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'line-pull-og-image.png';
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, 'image/png');
      });
    } catch (error) {
      status.textContent = `이미지 합성 실패: ${error.message}`;
    }
  </script>
</body>
</html>
