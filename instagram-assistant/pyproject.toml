[project]
name = "brand-instagram-assistant"
version = "0.1.0"
description = "Local-first Instagram comment and DM assistant for jiiwon.studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "instagrapi @ git+https://github.com/subzeroid/instagrapi.git@a38b575a73f2c5c78f417681b842776abb52415a",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
