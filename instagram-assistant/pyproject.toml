[project]
name = "brand-instagram-assistant"
version = "0.1.0"
description = "Local-first Instagram comment and DM assistant for jiiwon.studio"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "libsql>=0.1,<1",
  "turso-serverless>=0.1,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
