<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram 기록 · 관리자 로그인</title>
  <style>
    body {font: 16px/1.5 system-ui, sans-serif; background:#f6f5f2; margin:0; min-height:100vh; display:grid; place-items:center; color:#222}
    main {width:min(340px, calc(100vw - 48px)); padding:32px; border-radius:16px; background:white; box-shadow:0 8px 32px #0001}
    h1 {font-size:22px; margin:0 0 24px}
    label {display:block; margin-bottom:8px}
    input {box-sizing:border-box; width:100%; padding:12px; font:inherit; border:1px solid #bbb; border-radius:8px}
    button {width:100%; margin-top:20px; padding:12px; font:inherit; color:white; background:#262626; border:0; border-radius:8px; cursor:pointer}
  </style>
</head>
<body><main><h1>관리자 로그인</h1><form method="post" action="/api/admin/login"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit">로그인</button></form></main></body>
</html>
